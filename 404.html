<header class="bar">

<main class="nf">
  <span class="tag">Hata 404</span>
  <h1 id="t">404 – Sayfa bulunamadı</h1>
  <div id="b"><p>Aradığın sayfa burada değil.</p></div>
  <a class="btn" id="l" href="/">Ana sayfaya dön</a>
</main>

<script>
const JOKES = [
  {
    t: "404 – Sayfa Belirlenemedi",
    b: ["Heisenberg belirsizlik ilkesi gereği, bu sayfanın hem var olduğunu hem de olmadığını aynı anda söyleyebiliriz.",
        "Ama sen yine de bulamamışsın."],
    l: "Ana sayfaya dekoheransla.",
  },
  {
    t: "404 – Sayfa ışık hızında uzaklaştı",
    b: ["Sayfa senden ışık hızına yakın bir hızla uzaklaşıyor.",
        "Bu yüzden zamanı senin için yavaşladı ama sayfa hâlâ orada… bir yerde.",
        "Sadece ulaşamıyorsun."],
    l: "Ana sayfaya Lorentz dönüşümü yap.",
  },
  {
    t: "404 – Sayfa dışlandı",
    b: ["Bu sayfada zaten fermiyon var.", "Pauli diyo ki gitcekmişsin."],
    l: "Ana sayfaya dön.",
  },
];
const j = JOKES[Math.floor(Math.random() * JOKES.length)];
document.getElementById("t").textContent = j.t;
document.getElementById("b").replaceChildren(...j.b.map((s) => Object.assign(document.createElement("p"), { textContent: s })));
document.getElementById("l").textContent = j.l;
</script>
