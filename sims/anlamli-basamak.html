<script>
const R = String.raw;
const S = urlState({ mod: "ab", sayi: "0.004050", alet: 1, L: 1, dL: 0.01, dt: 0.2, n: 1 });
const top_ = document.getElementById("top"), calc = document.getElementById("calc"), rules = document.getElementById("rules"), formula = document.getElementById("formula");
const { ctx, size } = FR.canvas(document.getElementById("cv"));

// ---------- Anlamlı basamak sayacı ----------
// Her rakamı sınıflandırır: sig (anlamlı), lead (öndeki sıfır), amb (ondalık yoksa sondaki sıfır: belirsiz)
function classify(str) {
  const s = str.trim().replace(",", ".");
  const m = s.match(/^([-+]?)(\d*)(\.?)(\d*)(?:[eE]([-+]?\d+))?$/);
  if (!m || !(m[2] + m[4]).length) return null;
  const [, sign, intp, dot, fracp, exp] = m;
  const chars = [...intp].map((d) => ({ d })).concat(dot ? [{ d: ".", pt: true }] : [], [...fracp].map((d) => ({ d })));
  const digits = chars.filter((c) => !c.pt);
  const first = digits.findIndex((c) => c.d !== "0");
  if (first < 0) { digits.forEach((c) => (c.k = "lead")); return { sign, chars, exp, n: 0, amb: false, zero: true }; }
  let last = digits.length - 1;
  while (last > first && digits[last].d === "0") last--;
  digits.forEach((c, i) => {
    if (i < first) c.k = "lead";
    else if (i <= last) c.k = "sig";
    else c.k = dot || exp !== undefined ? "sig" : "amb";   // ondalık nokta ya da bilimsel gösterim varsa sondaki sıfır anlamlı
  });
  const n = digits.filter((c) => c.k === "sig").length, ambN = digits.filter((c) => c.k === "amb").length;
  return { sign, chars, exp, n, amb: ambN > 0, ambN };
}

// ---------- A4 ölçümü ----------
const A4 = { w: 21.0, h: 29.7 };                     // cm (gerçek boyut)
const ALETLER = [
  { ad: "şerit metre", bolme: "1 cm", res: 1, dec: 0 },
  { ad: "cetvel", bolme: "1 mm", res: 0.1, dec: 1 },
  { ad: "kumpas", bolme: "0.1 mm", res: 0.01, dec: 2 },
];
const sigOfReading = (v, dec) => { // okunan değerin anlamlı basamak sayısı: ilk sıfır olmayan rakamdan çözünürlüğe kadar
  const intDigits = Math.floor(Math.log10(Math.abs(v))) + 1;
  return intDigits + dec;
};
// Her zaman bilimsel gösterim, n anlamlı basamak: 1200, 2 → 1.2×10³
function sciTex(v, n) {
  const [m, e] = v.toExponential(Math.max(0, n - 1)).split("e");
  return `${m}\\times 10^{${+e}}`;
}
// n anlamlı basamağa yuvarla, LaTeX olarak (gerekirse bilimsel gösterim)
function sigTex(v, n) {
  const p = v.toPrecision(n);
  if (!/e/.test(p)) return p;
  const [m, e] = p.split("e");
  return `${m}\\times 10^{${+e}}`;
}

// ---------- Belirsizlik: sarkaçla g ölçümü ----------
const G_TRUE = 9.81;
const roundTo = (v, dec) => (dec >= 0 ? v.toFixed(dec) : String(Math.round(v / 10 ** -dec) * 10 ** -dec));
function belirsizlik() {
  const T_true = 2 * Math.PI * Math.sqrt(S.L / G_TRUE);
  const t_total = Math.round(S.n * T_true * 100) / 100;          // kronometre 0.01 s gösterir
  const T = t_total / S.n, dT = S.dt / S.n;
  const g = 4 * Math.PI ** 2 * S.L / T ** 2;
  const rL = S.dL / S.L, rT = 2 * dT / T, rel = rL + rT, dg = g * rel;
  // belirsizlik 1 anlamlı basamağa, değer aynı ondalık basamağa
  const dgR = Number(dg.toPrecision(1)), decR = -Math.floor(Math.log10(dgR));
  return { T_true, t_total, T, dT, g, rL, rT, rel, dg, dgR, decR, gR: roundTo(g, decR), dgS: roundTo(dgR, decR) };
}

// ---------- Kontroller ----------
const num = document.getElementById("num");
num.value = S.sayi;
num.oninput = () => { S.sayi = num.value; S.save(); render(); };
segment("mode", () => S.mod, (v) => { S.mod = v; S.save(); render(); });
segment("alet", () => String(S.alet), (v) => { S.alet = +v; S.save(); render(); });
const FMT = { L: (v) => `${(+v).toFixed(2)} m`, dL: (v) => `${(+v * 1000).toFixed(0)} mm`, dt: (v) => `${(+v).toFixed(2)} s`, n: (v) => `${v}` };
for (const k of ["L", "dL", "dt", "n"]) {
  const inp = document.getElementById(k), out = document.getElementById("o" + k);
  inp.value = S[k];
  const sync = () => (out.textContent = FMT[k](inp.value));
  inp.oninput = () => { S[k] = +inp.value; S.save(); sync(); render(); };
  sync();
}
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));

const RULES_AB = [
  "**Sıfır olmayan** *rakamlar her zaman anlamlıdır.*",
  "**Arada kalan sıfır** *anlamlıdır:* $1\\mathbf{0}5 \\to 3$",
  "**Öndeki sıfırlar** *anlamlı değildir:* $0.00\\mathbf{45} \\to 2$",
  "**Sondaki sıfır** *yalnız ondalık varsa:* $2.5\\mathbf{0} \\to 3$",
  "$\\times\\ \\div$*: en az anlamlı basamak kadar*",
  "$+\\ -$*: en az ondalık basamak kadar*",
];
const RULES_BEL = [
  R`**Bağıl:** $\Delta g/g = \cA{\Delta L/L} + \cB{2\,\Delta T/T}$`,
  "*Karesi alınanın bağıl hatası 2 ile çarpılır.*",
  R`*n salınım birlikte ölçülürse* $\Delta T = \Delta t / n$`,
  "**Yazım:** *Δg 1 anlamlı basamak; g aynı ondalığa.*",
];

// ---------- Çizim ----------
function drawAB(c, W, H) {
  const al = ALETLER[S.alet];
  const rw = A4.w.toFixed(al.dec), rh = (Math.round(A4.h / al.res) * al.res).toFixed(al.dec);
  // kâğıt (sol)
  const ph = H - 70, pw = ph * A4.w / A4.h, px = 50, py = 22;
  ctx.fillStyle = c.bg; ctx.strokeStyle = c.muted; ctx.lineWidth = 1.5;
  ctx.fillRect(px, py, pw, ph); ctx.strokeRect(px, py, pw, ph);
  ctx.fillStyle = c.muted; ctx.font = "600 15px 'Instrument Sans', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("A4", px + pw / 2, py + ph / 2);
  const dimArrow = (x0, y0, x1, y1, col) => {
    ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    for (const [x, y, dx, dy] of [[x0, y0, x1 - x0, y1 - y0], [x1, y1, x0 - x1, y0 - y1]]) {
      const l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + ux * 9 - uy * 4, y + uy * 9 + ux * 4); ctx.lineTo(x + ux * 9 + uy * 4, y + uy * 9 - ux * 4); ctx.fill();
    }
  };
  dimArrow(px, py + ph + 16, px + pw, py + ph + 16, c.accent);
  dimArrow(px - 18, py, px - 18, py + ph, c.accent2);
  ctx.font = "600 17px 'JetBrains Mono', monospace";
  ctx.fillStyle = c.accent; ctx.fillText(`${rw} cm`, px + pw / 2, py + ph + 36);
  ctx.save(); ctx.translate(px - 34, py + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = c.accent2; ctx.fillText(`${rh} cm`, 0, 0); ctx.restore();

  // büyüteç: kenarın yakından görünümü, alete göre ölçek (sağ)
  const zx = px + pw + 70, zw = W - zx - 30, zy = 40, zh = 70;
  if (zw < 160) return;
  const span = al.res * 10, lo = A4.w - span / 2, hi = A4.w + span / 2;
  const X = (v) => zx + (v - lo) / (hi - lo) * zw;
  ctx.fillStyle = c.muted; ctx.font = "13px 'Instrument Sans', sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  wrap(`Kenar yakından: ${al.ad}, en küçük bölme ${al.bolme}`, zx, zy - 8, zw, 16, true);
  // cetvel gövdesi
  ctx.fillStyle = c.bg; ctx.strokeStyle = c.muted; ctx.lineWidth = 1;
  ctx.fillRect(zx, zy, zw, zh); ctx.strokeRect(zx, zy, zw, zh);
  ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.font = "12px 'JetBrains Mono', monospace";
  for (let i = 0; i <= 10; i++) {
    const v = lo + i * al.res, x = X(v), major = i % 5 === 0;
    ctx.strokeStyle = c.ink; ctx.lineWidth = major ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(x, zy); ctx.lineTo(x, zy + (major ? 26 : 15)); ctx.stroke();
    if (major) { ctx.fillStyle = c.ink; ctx.fillText(v.toFixed(al.dec), x, zy + 30); }
  }
  // kâğıdın kenarı (gerçek konum) ve okunan değer
  const xe = X(A4.w);
  ctx.fillStyle = c.accent; ctx.globalAlpha = 0.12; ctx.fillRect(zx, zy + zh + 14, xe - zx, 44); ctx.globalAlpha = 1;
  ctx.strokeStyle = c.accent; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(xe, zy - 2); ctx.lineTo(xe, zy + zh + 58); ctx.stroke();
  ctx.fillStyle = c.muted; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = "13px 'Instrument Sans', sans-serif";
  ctx.fillText("kâğıt", xe - 8, zy + zh + 36);
  ctx.textAlign = "left"; ctx.font = "600 17px 'JetBrains Mono', monospace"; ctx.fillStyle = c.accent;
  ctx.fillText(`okunan: ${rw} cm`, zx, zy + zh + 84);
  ctx.font = "13.5px 'Instrument Sans', sans-serif"; ctx.fillStyle = c.muted; ctx.textBaseline = "top";
  wrap(`Son rakam en küçük bölmeye (${al.bolme}) karşılık gelir; daha ötesi okunamaz.`, zx, zy + zh + 100, zw, 18);
}

// Metni genişliğe göre satırlara böler. up: son satır y'de biter, satırlar yukarı doğru dizilir
function wrap(text, x, y, maxW, lineH, up = false) {
  const lines = [];
  let cur = "";
  for (const w of text.split(" ")) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  lines.push(cur);
  lines.forEach((l, i) => ctx.fillText(l, x, up ? y - (lines.length - 1 - i) * lineH : y + i * lineH));
}

function drawBel(c, W, H, b) {
  // 1) hata katkıları (çubuk)
  const x0 = 170, bw = W - x0 - 90, maxR = Math.max(0.06, b.rel * 1.1);
  const bar = (y, label, v, col) => {
    ctx.fillStyle = c.ink; ctx.font = "15px 'Instrument Sans', sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(label, x0 - 12, y + 11);
    ctx.fillStyle = col; ctx.fillRect(x0, y, bw * v / maxR, 22);
    ctx.fillStyle = c.ink; ctx.textAlign = "left"; ctx.font = "600 15px 'JetBrains Mono', monospace";
    ctx.fillText(`%${(v * 100).toFixed(1)}`, x0 + bw * v / maxR + 8, y + 11);
  };
  ctx.fillStyle = c.muted; ctx.font = "13px 'Instrument Sans', sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("Bağıl belirsizliğe katkılar", 20, 14);
  bar(40, "ΔL / L", b.rL, c.accent);
  bar(70, "2 · ΔT / T", b.rT, c.accent2);
  ctx.strokeStyle = c.line; ctx.beginPath(); ctx.moveTo(x0, 102); ctx.lineTo(x0 + bw, 102); ctx.stroke();
  bar(108, "toplam Δg / g", b.rel, c.ink);

  // 2) sayı doğrusu: g ± Δg aralığı ve kabul edilen değer
  const ly = Math.max(190, H - 70), lo = 8.0, hi = 11.6, pad = 30;
  const X = (v) => pad + (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * (W - 2 * pad);
  ctx.fillStyle = c.muted; ctx.font = "13px 'Instrument Sans', sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillText("Ölçüm aralığı ve kabul edilen değer (m/s²)", 20, ly - 48);
  ctx.strokeStyle = c.muted; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, ly); ctx.lineTo(W - pad, ly); ctx.stroke();
  ctx.font = "12px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = c.muted;
  for (let v = lo; v <= hi + 1e-9; v += 0.4) {
    ctx.beginPath(); ctx.moveTo(X(v), ly - 5); ctx.lineTo(X(v), ly + 5); ctx.stroke();
    ctx.fillText(v.toFixed(1), X(v), ly + 9);
  }
  const g = +b.gR, d = b.dgR, inside = Math.abs(G_TRUE - g) <= d + 1e-9;
  ctx.fillStyle = inside ? c.ok : c.accent2; ctx.globalAlpha = 0.25;
  ctx.fillRect(X(g - d), ly - 16, X(g + d) - X(g - d), 32); ctx.globalAlpha = 1;
  ctx.strokeStyle = inside ? c.ok : c.accent2; ctx.lineWidth = 2;
  ctx.strokeRect(X(g - d), ly - 16, X(g + d) - X(g - d), 32);
  ctx.fillStyle = c.ink; ctx.beginPath(); ctx.arc(X(g), ly, 5, 0, 7); ctx.fill();
  // kabul edilen değer
  ctx.strokeStyle = c.ink; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X(G_TRUE), ly - 30); ctx.lineTo(X(G_TRUE), ly + 22); ctx.stroke(); ctx.setLineDash([]);
  ctx.textBaseline = "bottom"; ctx.font = "13px 'Instrument Sans', sans-serif"; ctx.fillStyle = c.ink;
  ctx.fillText(`kabul edilen 9.81 ${inside ? "✓ aralıkta" : "✗ aralık dışında"}`, X(G_TRUE), ly - 32);
}

function draw() {
  const { w: W, h: H } = size(), c = FR.colors();
  ctx.clearRect(0, 0, W, H);
  if (S.mod === "bel") drawBel(c, W, H, belirsizlik()); else drawAB(c, W, H);
}

// ---------- Metin ----------
function renderAB() {
  const cl = classify(S.sayi);
  if (!cl) top_.innerHTML = `<div class="count">${rich("*Geçerli bir sayı yazın (ör. 0.004050, 1200, 2.50e3).*")}</div>`;
  else {
    const digits = cl.chars.map((ch) => ch.pt ? `<span class="pt">.</span>` : `<span class="${ch.k}">${ch.d}</span>`).join("");
    const expo = cl.exp !== undefined ? `<span class="pt"> × 10</span><sup style="font-size:.5em">${cl.exp}</sup>` : "";
    const cnt = cl.zero ? "Sıfırın anlamlı basamağı tanımsızdır."
      : cl.amb ? `**${cl.n}** ile **${cl.n + cl.ambN}** arası anlamlı basamak — *belirsiz!* Bilimsel gösterimle netleşir: ` +
          `$${sciTex(Number(S.sayi.replace(",", ".")), cl.n)}$ *(${cl.n})* ya da $${sciTex(Number(S.sayi.replace(",", ".")), cl.n + cl.ambN)}$ *(${cl.n + cl.ambN})*`
      : `**${cl.n}** anlamlı basamak`;
    top_.innerHTML = `<div class="digits">${cl.sign === "-" ? "−" : ""}${digits}${expo}</div>` +
      `<div class="count">${rich(cnt)}</div>` +
      `<div class="legend"><span><span class="sw2" style="background:var(--accent)"></span><b>anlamlı</b></span>` +
      `<span><span class="sw2" style="background:var(--muted);opacity:.5"></span>öndeki sıfır (yer tutucu)</span>` +
      `<span><span class="sw2" style="background:var(--accent-2)"></span>belirsiz sondaki sıfır</span></div>`;
  }
  const al = ALETLER[S.alet];
  const a = A4.w, h = Math.round(A4.h / al.res) * al.res;
  const sa = sigOfReading(a, al.dec), sh = sigOfReading(h, al.dec), nmin = Math.min(sa, sh);
  const area = a * h, per = 2 * (a + h);
  const fa = a.toFixed(al.dec), fh = h.toFixed(al.dec);
  setEqs(formula, [R`$\text{Alan} = a\times b,\quad \text{Çevre} = 2(a+b)$`]);
  setEqs(calc, [
    `$\\cA{a} = \\cA{${fa}}\\ \\text{cm}$ *(${sa} a.b.)*, $\\ \\cB{b} = \\cB{${fh}}\\ \\text{cm}$ *(${sh} a.b.)*`,
    `**Alan:** $\\cA{${fa}}\\times\\cB{${fh}} = ${Number(area.toFixed(6))}$ *(hesap makinesi)*`,
    `$\\to\\ \\mathbf{${sigTex(area, nmin)}}\\ \\text{cm}^2$ *(${nmin} a.b.: en az olan)*`,
    `**Çevre:** $2(\\cA{${fa}} + \\cB{${fh}}) = ${Number(per.toFixed(6))}$`,
    `$\\to\\ \\mathbf{${per.toFixed(al.dec)}}\\ \\text{cm}$ *(${al.dec} ondalık: en az olan)*`,
  ]);
  setEqs(rules, RULES_AB);
}

function renderBel() {
  const b = belirsizlik();
  setEqs(formula, [R`$g = \dfrac{4\pi^2 L}{T^2}$`]);
  top_.innerHTML = `<div class="result">${rich(`$g = (\\mathbf{${b.gR}} \\pm ${b.dgS})\\ \\text{m/s}^2$`)}</div>` +
    `<div class="count">${rich(`*Ölçüm:* $L = ${S.L.toFixed(2)} \\pm ${S.dL.toFixed(3)}$ m, $\\ ${S.n}$ *salınım* $= ${b.t_total.toFixed(2)} \\pm ${S.dt.toFixed(2)}$ s`)}</div>`;
  setEqs(calc, [
    `$T = ${b.t_total.toFixed(2)}/${S.n} = ${b.T.toFixed(3)}\\ \\text{s}$`,
    `$\\Delta T = ${S.dt.toFixed(2)}/${S.n} = ${b.dT.toFixed(3)}\\ \\text{s}$`,
    `$g = 4\\pi^2 (${S.L.toFixed(2)})/(${b.T.toFixed(3)})^2 = ${b.g.toFixed(3)}$`,
    `$\\Delta g/g = \\cA{${b.rL.toFixed(4)}} + \\cB{${b.rT.toFixed(4)}} = ${b.rel.toFixed(4)}$`,
    `$\\Delta g = ${b.dg.toFixed(3)} \\to \\mathbf{${b.dgS}}\\ \\text{m/s}^2$`,
  ]);
  setEqs(rules, RULES_BEL);
}

function render() {
  document.getElementById("pane-ab").hidden = S.mod !== "ab";
  document.getElementById("pane-bel").hidden = S.mod !== "bel";
  S.mod === "bel" ? renderBel() : renderAB();
  draw();
}
new ResizeObserver(draw).observe(document.getElementById("cv"));
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
document.fonts?.addEventListener("loadingdone", draw);
render();
</script>
</body>
</html>
