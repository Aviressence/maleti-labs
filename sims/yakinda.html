<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yakında · MaLeTiLabs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/marka/ikon-acik-tema.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="../assets/marka/ikon-koyu-tema.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css?v=33242439">
<script src="../assets/core.js?v=a1fdf950"></script>
<style>
  .soon { display: grid; place-items: center; text-align: center; padding: 24px;
    background-image: repeating-linear-gradient(135deg, transparent 0 14px, var(--grid) 14px 28px); }
  .soon h2 { margin: 10px 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .soon p { margin: 0; color: var(--muted); font-size: 15px; }
</style>
</head>
<body class="sim-page">

<!-- İskelet: henüz yapılmamış her simülasyon bu sayfayı açar (?ad=…&ders=…&hafta=…).
     Simülasyon bitince ana sayfadaki bağlantı kendi dosyasına yönlendirilir. -->
<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">
      <img class="mark light" src="../assets/marka/ikon-acik-tema.png" alt=""><img class="mark dark" src="../assets/marka/ikon-koyu-tema.png" alt="">
      <span>MaLeTi<em>Labs</em></span>
    </a>
    <nav><a id="back" href="../index.html">← Ana sayfa</a></nav>
    <button class="icon-btn" data-theme-toggle aria-label="Temayı değiştir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="sim-title">
    <div><span class="tag" id="where"></span><h1 id="title">Simülasyon</h1></div>
    <span class="tag">henüz bitmedi</span>
  </div>
  <div class="sim-layout">
    <div class="stage soon">
      <div>
        <span class="tag">Hazırlanıyor</span>
        <h2>Bu simülasyon henüz bitmedi</h2>
        <p>Dönem ilerledikçe eklenecek.</p>
      </div>
    </div>
    <aside class="panel">
      <span class="tag">Durum</span>
      <p class="note">Bu sayfa bir iskelettir; simülasyon hazır olduğunda burada açılacak.</p>
      <a class="btn ghost" id="back2" href="../index.html">← Ana sayfaya dön</a>
    </aside>
  </div>
</main>

<script>
// Adresten gelen değerler yalnızca textContent ile yazılır (HTML olarak yorumlanmaz)
const q = new URLSearchParams(location.search);
const DERS = { fizik1: "Fizik 1", dalgalar: "Dalgalar & Optik" };
const ad = (q.get("ad") || "Simülasyon").slice(0, 80), ders = DERS[q.get("ders")] || "", hafta = parseInt(q.get("hafta"), 10);
document.getElementById("title").textContent = ad;
document.title = `${ad} (yakında) · MaLeTiLabs`;
document.getElementById("where").textContent = [ders, hafta > 0 && hafta < 20 ? `Hafta ${String(hafta).padStart(2, "0")}` : ""].filter(Boolean).join(" · ");
if (DERS[q.get("ders")]) {
  const back = `../index.html#${q.get("ders")}`;
  document.getElementById("back").href = back; document.getElementById("back2").href = back;
  document.getElementById("back").textContent = `← ${ders}`;
}
</script>
</body>
</html>
