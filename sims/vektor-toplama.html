<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vektör Toplama · MaLeTiLabs</title>
<link rel="icon" href="../assets/marka/ikon-acik-tema.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="../assets/marka/ikon-koyu-tema.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/katex-0.18.9/katex.min.css">
<link rel="stylesheet" href="../assets/style.css?v=27fa7afa">
<script src="../assets/katex-0.18.9/katex.min.js"></script>
<script src="../assets/core.js?v=b689f43c"></script>
<script src="../assets/vec.js?v=628245b8"></script>
</head>
<body class="sim-page">

<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">
      <img class="mark light" src="../assets/marka/ikon-acik-tema.png" alt=""><img class="mark dark" src="../assets/marka/ikon-koyu-tema.png" alt="">
      <span class="wm"><span class="l1">Ma</span><span class="l2">Le</span><span class="l3">Ti</span><em>Labs</em></span>
    </a>
    <nav><a href="../index.html#fizik1">← Fizik 1</a></nav>
    <button class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Koyu tema"><span class="knob"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3z"/></svg></span></button>
  </div>
</header>

<main class="wrap">
  <div class="sim-title">
    <div><span class="tag">Fizik 1 · Hafta 01</span><h1>Vektör Toplama</h1></div>
    <div class="sim-formula" id="formula"></div>
  </div>

  <div class="sim-layout">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <span class="stage-hint">Okların uçlarını sürükleyin</span>
    </div>

    <aside class="panel">
      <div class="opt-row">
        <span class="tag">Yöntem</span>
        <div class="seg" id="mode">
          <button data-v="tail">Uç uca</button>
          <button data-v="para">Paralelkenar</button>
        </div>
      </div>
      <div class="opt-row">
        <span class="tag">İşlem</span>
        <div class="seg" id="op">
          <button data-v="add" data-tex="$\vec A + \vec B$"></button>
          <button data-v="sub" data-tex="$\vec A - \vec B$"></button>
        </div>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="comp"> Bileşenler</label>
        <label class="check"><input type="checkbox" id="snap" checked> Izgaraya yapıştır</label>
      </div>

      <table class="vtable">
        <thead><tr><th></th><th data-tex="$x$"></th><th data-tex="$y$"></th><th data-tex="$|\vec v|$"></th><th data-tex="$\theta$"></th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
      <div class="calc" id="calc"></div>
      <div class="rules"><span class="tag">Kurallar</span><div class="calc rules-list" id="rules"></div></div>

      <div class="row">
        <button class="btn ghost" id="reset">Sıfırla</button>
        <button class="btn ghost" id="fs">Tam ekran</button>
      </div>
    </aside>
  </div>
</main>

<script>
document.querySelectorAll("[data-tex]").forEach((el) => (el.innerHTML = rich(el.dataset.tex)));

const S = urlState({ ax: 4, ay: 2, bx: 1, by: 4, yontem: "tail", islem: "add", bilesen: 0 });
const comp = document.getElementById("comp"), snap = document.getElementById("snap");
comp.checked = S.bilesen === 1;
comp.onchange = () => { S.bilesen = comp.checked ? 1 : 0; S.save(); };
segment("mode", () => S.yontem, (v) => { S.yontem = v; S.save(); });
segment("op", () => S.islem, (v) => { S.islem = v; S.save(); });
document.getElementById("reset").onclick = () => { Object.assign(S, { ax: 4, ay: 2, bx: 1, by: 4 }); S.save(); };
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));

const P = Plane(document.getElementById("cv"));
P.snap = () => snap.checked;
const A = () => ({ x: S.ax, y: S.ay }), B = () => ({ x: S.bx, y: S.by });
const Bs = () => (S.islem === "sub" ? V.neg(B()) : B());       // işlemde kullanılan ikinci vektör
const chained = () => S.yontem === "tail" && S.islem === "add"; // B, A'nın ucundan başlıyor mu
P.draggable(
  () => [{ id: "B", p: chained() ? V.add(A(), B()) : B() }, { id: "A", p: A() }],
  (id, p) => {
    if (id === "A") { S.ax = p.x; S.ay = p.y; return; }
    const b = chained() ? { x: p.x - S.ax, y: p.y - S.ay } : p;
    S.bx = +b.x.toFixed(2); S.by = +b.y.toFixed(2);
  },
  S.save
);

const tbl = document.getElementById("tbl"), formula = document.getElementById("formula");
const calc = document.getElementById("calc"), rules = document.getElementById("rules");
const NAMES = { A: tex("\\vA"), B: tex("\\vB"), R: tex("\\vR") };
const zero = { x: 0, y: 0 };

const RULES_ADD = [
  "**Değişme:** $\\vA + \\vB = \\vB + \\vA$",
  "**Birleşme:** $(\\vA + \\vB) + \\vec C = \\vA + (\\vB + \\vec C)$",
  "**Bileşenler:** $R_x = A_x + B_x,\\; R_y = A_y + B_y$",
  "**Üçgen eşitsizliği:** $|\\vA + \\vB| \\le |\\vA| + |\\vB|$",
];
const RULES_SUB = [
  "**Tanım:** $\\vA - \\vB = \\vA + (-\\vB)$",
  "$-\\vB$: *aynı büyüklük, ters yön*",
  "**Sıra önemli:** $\\vB - \\vA = -(\\vA - \\vB)$",
  "**Bileşenler:** $R_x = A_x - B_x,\\; R_y = A_y - B_y$",
];

function frame() {
  P.layout(0.4, 0.65);
  const c = FR.colors();
  P.grid(c);
  const a = A(), b2 = Bs(), R = V.add(a, b2), sub = S.islem === "sub";
  const cA = c.accent, cB = c.accent2, cR = c.ink, bLabel = sub ? "−B" : "B";
  const comps = (from, v, col) => { if (comp.checked) { P.dashed(from, { x: from.x + v.x, y: from.y }, col); P.dashed({ x: from.x + v.x, y: from.y }, V.add(from, v), col); } };

  if (sub) P.arrow(zero, B(), cB, { dash: [6, 5], label: "B", alpha: 0.45, width: 2 });
  if (S.yontem === "tail") {
    P.arrow(zero, a, cA, { label: "A" });
    P.arrow(a, b2, cB, { label: bLabel });
    comps(zero, a, cA); comps(a, b2, cB);
  } else {
    P.arrow(b2, a, cA, { dash: [4, 5], width: 1.5, alpha: 0.6 });
    P.arrow(a, b2, cB, { dash: [4, 5], width: 1.5, alpha: 0.6 });
    P.arrow(zero, a, cA, { label: "A" });
    P.arrow(zero, b2, cB, { label: bLabel });
    comps(zero, a, cA); comps(zero, b2, cB);
  }
  comps(zero, R, cR);
  P.arrow(zero, R, cR, { width: 3.5, label: "R" });
  if (V.mag(R) > 0.3) P.arc(zero, 30, 0, V.ang(R), cR, "θ");
  P.handle(a, cA);
  P.handle(chained() ? V.add(a, B()) : B(), cB);

  setEqs(formula, [sub ? "$\\vR = \\vA - \\vB = \\vA + (-\\vB)$" : "$\\vR = \\vA + \\vB$"]);

  const f = V.fmt, p = V.par, mR = V.mag(R);
  const deg = (v) => (V.mag(v) < 0.005 ? "–" : V.ang(v).toFixed(1) + "°");
  const row = (k, v) => `<tr><td>${NAMES[k]}</td><td>${f(v.x)}</td><td>${f(v.y)}</td><td>${f(V.mag(v))}</td><td>${deg(v)}</td></tr>`;
  const rows = row("A", a) + row("B", B()) + row("R", R);
  if (tbl._rows !== rows) { tbl._rows = rows; tbl.innerHTML = rows; }

  const op = sub ? "-" : "+";
  setEqs(calc, [
    `$R_x = \\cA{A_x} ${op} \\cB{B_x} = \\cA{${p(a.x)}} ${op} \\cB{${p(S.bx)}} = \\mathbf{${f(R.x)}}$`,
    `$R_y = \\cA{A_y} ${op} \\cB{B_y} = \\cA{${p(a.y)}} ${op} \\cB{${p(S.by)}} = \\mathbf{${f(R.y)}}$`,
    `$|\\vR| = \\sqrt{R_x^2 + R_y^2} = \\sqrt{${p(R.x)}^2 + ${p(R.y)}^2} = \\mathbf{${f(mR)}}$`,
    mR < 0.005 ? "$\\vR = \\vec 0$ *(yön tanımsız)*" : `$\\theta = \\mathbf{${V.ang(R).toFixed(1)}^\\circ}$ *(+x ekseninden)*`,
  ]);
  setEqs(rules, sub ? RULES_SUB : RULES_ADD);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
