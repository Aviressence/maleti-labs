<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vektör Toplama · MaLeTiLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/core.js"></script>
<script src="../assets/vec.js"></script>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-4 5-2"/><circle cx="12" cy="12" r="10.5" stroke-opacity=".35"/></svg>
      <span>MaLeTi<em>Labs</em></span>
    </a>
    <nav><a href="../index.html#fizik1">← Fizik 1</a></nav>
    <button class="icon-btn" data-theme-toggle aria-label="Temayı değiştir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="sim-title">
    <div><span class="tag">Fizik 1 · Hafta 01</span><h1>Vektör Toplama</h1></div>
    <span class="tag" id="formula">R = A + B</span>
  </div>

  <div class="sim-layout">
    <div class="stage" id="stage"><canvas id="cv" style="touch-action:none"></canvas></div>

    <aside class="panel">
      <div>
        <span class="tag">Yöntem</span>
        <div class="seg" id="mode" style="margin-top:6px">
          <button data-v="tail">Uç uca</button>
          <button data-v="para">Paralelkenar</button>
        </div>
      </div>
      <div>
        <span class="tag">İşlem</span>
        <div class="seg" id="op" style="margin-top:6px">
          <button data-v="add">A + B</button>
          <button data-v="sub">A − B</button>
        </div>
      </div>

      <label class="check"><input type="checkbox" id="comp"> Bileşenleri göster</label>
      <label class="check"><input type="checkbox" id="snap" checked> Izgaraya yapıştır</label>

      <table class="vtable">
        <thead><tr><th></th><th>x</th><th>y</th><th>|v|</th><th>θ</th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
      <div class="calc" id="calc"></div>
      <div class="rules"><span class="tag">Kurallar</span><div class="calc rules-list" id="rules"></div></div>

      <div class="row">
        <button class="btn ghost" id="reset">Sıfırla</button>
        <button class="btn ghost" id="fs">Tam ekran</button>
      </div>

      <p class="note">Vektörlerin uçlarını sürükleyin.</p>
    </aside>
  </div>
</main>

<script>
const S = urlState({ ax: 4, ay: 2, bx: 1, by: 4, yontem: "tail", islem: "add", bilesen: 0 });
const comp = document.getElementById("comp"), snap = document.getElementById("snap");
comp.checked = S.bilesen === 1;
comp.onchange = () => { S.bilesen = comp.checked ? 1 : 0; S.save(); };
segment("mode", () => S.yontem, (v) => { S.yontem = v; S.save(); });
segment("op", () => S.islem, (v) => { S.islem = v; S.save(); });
document.getElementById("reset").onclick = () => { Object.assign(S, { ax: 4, ay: 2, bx: 1, by: 4 }); S.save(); };
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));

const P = Plane(document.getElementById("cv"));
P.snap = () => snap.checked;
const A = () => ({ x: S.ax, y: S.ay }), B = () => ({ x: S.bx, y: S.by });
const Bs = () => (S.islem === "sub" ? V.neg(B()) : B());       // işlemde kullanılan ikinci vektör
const chained = () => S.yontem === "tail" && S.islem === "add"; // B, A'nın ucundan başlıyor mu
P.draggable(
  () => [{ id: "B", p: chained() ? V.add(A(), B()) : B() }, { id: "A", p: A() }],
  (id, p) => {
    if (id === "A") { S.ax = p.x; S.ay = p.y; return; }
    const b = chained() ? { x: p.x - S.ax, y: p.y - S.ay } : p;
    S.bx = +b.x.toFixed(2); S.by = +b.y.toFixed(2);
  },
  S.save
);

const tbl = document.getElementById("tbl"), formula = document.getElementById("formula");
const calc = document.getElementById("calc"), rules = document.getElementById("rules");
const zero = { x: 0, y: 0 };

function frame() {
  P.layout(0.4, 0.65);
  const c = FR.colors();
  P.grid(c);
  const a = A(), b2 = Bs(), R = V.add(a, b2);
  const cA = c.accent, cB = c.accent2, cR = c.ink, bLabel = S.islem === "sub" ? "−B" : "B";
  const comps = (from, v, col) => { if (comp.checked) { P.dashed(from, { x: from.x + v.x, y: from.y }, col); P.dashed({ x: from.x + v.x, y: from.y }, V.add(from, v), col); } };

  if (S.islem === "sub") P.arrow(zero, B(), cB, { dash: [6, 5], label: "B", alpha: 0.45, width: 2 });
  if (S.yontem === "tail") {
    P.arrow(zero, a, cA, { label: "A" });
    P.arrow(a, b2, cB, { label: bLabel });
    comps(zero, a, cA); comps(a, b2, cB);
  } else {
    P.arrow(b2, a, cA, { dash: [4, 5], width: 1.5, alpha: 0.6 });
    P.arrow(a, b2, cB, { dash: [4, 5], width: 1.5, alpha: 0.6 });
    P.arrow(zero, a, cA, { label: "A" });
    P.arrow(zero, b2, cB, { label: bLabel });
    comps(zero, a, cA); comps(zero, b2, cB);
  }
  comps(zero, R, cR);
  P.arrow(zero, R, cR, { width: 3.5, label: "R" });
  if (V.mag(R) > 0.3) P.arc(zero, 30, 0, V.ang(R), cR, "θ");
  P.handle(a, cA);
  P.handle(chained() ? V.add(a, B()) : B(), cB);

  formula.textContent = S.islem === "sub" ? "R = A − B = A + (−B)" : "R = A + B";
  const row = (name, v, col) =>
    `<tr><td><span class="sw" style="background:${col}"></span>${name}</td><td>${V.fmt(v.x)}</td><td>${V.fmt(v.y)}</td><td>${V.fmt(V.mag(v))}</td><td>${V.mag(v) < 0.005 ? "–" : V.ang(v).toFixed(1) + "°"}</td></tr>`;
  tbl.innerHTML = row("A", a, cA) + row("B", B(), cB) + row("R", R, cR);

  const f = V.fmt, s = S.islem === "sub" ? "−" : "+";
  setEqs(calc, [
    `Rₓ = Aₓ ${s} Bₓ = ${f(a.x)} ${s} (${f(S.bx)}) = <b>${f(R.x)}</b>`,
    `R_y = A_y ${s} B_y = ${f(a.y)} ${s} (${f(S.by)}) = <b>${f(R.y)}</b>`,
    `|R| = √(Rₓ² + R_y²) = <b>${f(V.mag(R))}</b>`,
    `θ = <b>${V.mag(R) < 0.005 ? "–" : V.ang(R).toFixed(1) + "°"}</b>`,
  ]);
  setEqs(rules, S.islem === "sub" ? [
    "A − B = A + (−B)",
    "−B: B ile aynı büyüklük, ters yön",
    "A − B ≠ B − A,  B − A = −(A − B)",
    "Rₓ = Aₓ − Bₓ,  R_y = A_y − B_y",
  ] : [
    "A + B = B + A  (değişme)",
    "(A + B) + C = A + (B + C)  (birleşme)",
    "Rₓ = Aₓ + Bₓ,  R_y = A_y + B_y",
    "|A + B| ≤ |A| + |B|",
  ]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
