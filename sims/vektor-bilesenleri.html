<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vektörün Bileşenleri · MaLeTiLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/katex-0.18.9/katex.min.css">
<link rel="stylesheet" href="../assets/style.css?v=07657dc9">
<script src="../assets/katex-0.18.9/katex.min.js"></script>
<script src="../assets/core.js?v=a0c8a4df"></script>
<script src="../assets/vec.js?v=7aa14077"></script>
</head>
<body class="sim-page">

<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-4 5-2"/><circle cx="12" cy="12" r="10.5" stroke-opacity=".35"/></svg>
      <span>MaLeTi<em>Labs</em></span>
    </a>
    <nav><a href="../index.html#fizik1">← Fizik 1</a></nav>
    <button class="icon-btn" data-theme-toggle aria-label="Temayı değiştir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="sim-title">
    <div><span class="tag">Fizik 1 · Hafta 01</span><h1>Vektörün Bileşenleri</h1></div>
    <div class="sim-formula" id="formula"></div>
  </div>

  <div class="sim-layout">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <span class="stage-hint">Okun ucunu sürükleyin</span>
    </div>

    <aside class="panel">
      <div class="checks">
        <label class="check"><input type="checkbox" id="unit"> <span data-tex="Birim vektörler $\hat\imath,\ \hat\jmath$"></span></label>
        <label class="check"><input type="checkbox" id="snap" checked> Izgaraya yapıştır</label>
      </div>
      <div class="calc" id="calc"></div>
      <div class="rules"><span class="tag">Kurallar</span><div class="calc rules-list" id="rules"></div></div>
      <div class="row">
        <button class="btn ghost" id="reset">Sıfırla</button>
        <button class="btn ghost" id="fs">Tam ekran</button>
      </div>
    </aside>
  </div>
</main>

<script>
document.querySelectorAll("[data-tex]").forEach((el) => (el.innerHTML = rich(el.dataset.tex)));

const S = urlState({ ax: 4, ay: 3, birim: 0 });
const unitCb = document.getElementById("unit"), snap = document.getElementById("snap");
unitCb.checked = S.birim === 1;
unitCb.onchange = () => { S.birim = unitCb.checked ? 1 : 0; S.save(); };
document.getElementById("reset").onclick = () => { S.ax = 4; S.ay = 3; S.save(); };
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));

const P = Plane(document.getElementById("cv"));
P.snap = () => snap.checked;
P.draggable(() => [{ id: "A", p: { x: S.ax, y: S.ay } }], (id, p) => { S.ax = p.x; S.ay = p.y; }, S.save);
const calc = document.getElementById("calc"), zero = { x: 0, y: 0 };

setEqs(document.getElementById("formula"), ["$\\vec A = \\cA{A_x}\\,\\ii + \\cB{A_y}\\,\\jj$"]);
setEqs(document.getElementById("rules"), [
  "**Bileşenler:** $\\cA{A_x} = |\\vec A|\\cos\\theta,\\; \\cB{A_y} = |\\vec A|\\sin\\theta$",
  "**Büyüklük:** $|\\vec A| = \\sqrt{A_x^2 + A_y^2}$",
  "**Yön:** $\\tan\\theta = A_y / A_x$",
  "*x bileşeni negatifse θ'ya 180° eklenir*",
  "**Birim vektörler:** $|\\ii| = |\\jj| = 1,\\; \\ii \\perp \\jj$",
]);

function frame() {
  P.layout(0.4, 0.65);
  const c = FR.colors();
  P.grid(c);
  const A = { x: S.ax, y: S.ay }, m = V.mag(A), th = V.ang(A);
  P.dashed({ x: 0, y: A.y }, A, c.muted);
  P.arrow(zero, { x: A.x, y: 0 }, c.accent, { width: 3, label: "A_x", side: -1, vec: false });
  P.arrow({ x: A.x, y: 0 }, { x: 0, y: A.y }, c.accent2, { width: 3, label: "A_y", side: A.x * A.y >= 0 ? -1 : 1, vec: false });
  if (S.birim) {
    P.arrow(zero, { x: 1, y: 0 }, c.ink, { width: 4, label: "î", side: -1, vec: false });
    P.arrow(zero, { x: 0, y: 1 }, c.ink, { width: 4, label: "ĵ", vec: false });
  }
  P.arrow(zero, A, c.ink, { width: 3.5, label: "A" });
  if (m > 0.3) P.arc(zero, 34, 0, th, c.ink, "θ");
  P.handle(A, c.ink);

  const f = V.fmt, t = th.toFixed(1), sign = A.y < 0 ? "-" : "+";
  setEqs(calc, m < 0.005 ? ["$\\vec A = \\vec 0$ *(yön tanımsız)*"] : [
    `$|\\vec A| = \\sqrt{A_x^2 + A_y^2} = \\mathbf{${f(m)}}$`,
    `$\\theta = \\mathbf{${t}^\\circ}$ *(+x ekseninden)*`,
    `$\\cA{A_x} = |\\vec A|\\cos\\theta = ${f(m)}\\cdot\\cos ${t}^\\circ = \\cA{\\mathbf{${f(A.x)}}}$`,
    `$\\cB{A_y} = |\\vec A|\\sin\\theta = ${f(m)}\\cdot\\sin ${t}^\\circ = \\cB{\\mathbf{${f(A.y)}}}$`,
    `$\\vec A = \\cA{${f(A.x)}}\\,\\ii ${sign} \\cB{${f(Math.abs(A.y))}}\\,\\jj$`,
  ]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
