<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yer Değiştirme ve Alınan Yol · MaLeTiLabs</title>
<meta name="description" content="Yer değiştirme ile alınan yolun farkı: geri dönen ve salınan hareketlerde Δx, konum–zaman ve hız–zaman grafikleri. Etkileşimli fizik simülasyonu.">

<body class="sim-page">

<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">
      <img class="mark light" src="../assets/marka/ikon-acik-tema.png" alt=""><img class="mark dark" src="../assets/marka/ikon-koyu-tema.png" alt="">
      <span class="wm"><span class="l1">Ma</span><span class="l2">Le</span><span class="l3">Ti</span><em>Labs</em></span>
    </a>
    <nav><a href="../index.html#fizik1">← Fizik 1</a></nav>
    <button class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Koyu tema"><span class="knob"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3z"/></svg></span></button>
  </div>
</header>


<main class="wrap">
  <div class="sim-title">
    <div><span class="tag">Fizik 1 · Hafta 02</span><h1>Yer Değiştirme ve Alınan Yol</h1></div>
    <div class="sim-formula" id="formula"></div>
  </div>

  <div class="sim-layout">
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>

    <aside class="panel">
      <div class="ctrl"><label><span>Hareket</span></label>
        <div class="seg" id="preset">
          <button data-v="tek">Tek yön</button>
          <button data-v="donen">Gidip dönen</button>
          <button data-v="salinan">Gidip gelen</button>
        </div></div>
      <div class="ctrl"><label><span>Zaman <i>t</i></span><output id="ot"></output></label>
        <input type="range" id="t" min="0" max="10" step="0.05"></div>
      <div class="calc" id="calc"></div>
      <div class="rules"><span class="tag">Kurallar</span><div class="calc rules-list" id="rules"></div></div>
      <div class="row">
        <button class="btn" id="play">Oynat</button>
        <button class="btn ghost" id="reset">Başa al</button>
        <button class="btn ghost" id="fs">Tam ekran</button>
      </div>
    </aside>
  </div>
</main>

<script>
const R = String.raw, TMAX = 10, W5 = 0.4 * Math.PI;
// Hazır hareketler: x(t), v(t) (SI)
const MOTIONS = {
  tek:     { x: (t) => -8 + 1.6 * t, v: () => 1.6 },
  donen:   { x: (t) => -8 + 6 * t - 0.6 * t * t, v: (t) => 6 - 1.2 * t },
  salinan: { x: (t) => 7 * Math.sin(W5 * t), v: (t) => 7 * W5 * Math.cos(W5 * t) },
};
const S = urlState({ h: "donen" });
if (!MOTIONS[S.h]) S.h = "donen";
const M = () => MOTIONS[S.h];
let t = 0, running = false, last = 0;

// Alınan yol s(t) = ∫|v| dt (Simpson, küçük adım); dönüş sayısı da sayılır
function path(tt) {
  const n = Math.max(1, Math.ceil(tt / 0.005)), h = tt / n, v = M().v;
  let s = 0, turns = 0, prev = Math.sign(v(0));
  for (let k = 0; k < n; k++) {
    const a = v(k * h), b = v(k * h + h / 2), c = v((k + 1) * h);
    s += h * (Math.abs(a) + 4 * Math.abs(b) + Math.abs(c)) / 6;
    const sg = Math.sign(c); if (sg && prev && sg !== prev) turns++; if (sg) prev = sg;
  }
  return { s, turns };
}

// --- Kontroller ---
const tIn = document.getElementById("t"), tOut = document.getElementById("ot"), playBtn = document.getElementById("play");
const setT = (v) => { t = Math.min(TMAX, Math.max(0, v)); tIn.value = t; tOut.textContent = `${t.toFixed(2)} s`; };
const pause = () => { running = false; playBtn.textContent = "Oynat"; };
tIn.oninput = () => { pause(); setT(+tIn.value); render(); };
segment("preset", () => S.h, (v) => { S.h = v; S.save(); render(); });
playBtn.onclick = () => {
  if (t >= TMAX) setT(0);
  running = !running; playBtn.textContent = running ? "Duraklat" : "Oynat";
  last = performance.now(); if (running) requestAnimationFrame(loop);
};
document.getElementById("reset").onclick = () => { pause(); setT(0); render(); };
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));
function loop(now) {
  if (!running) return;
  setT(t + (now - last) / 1000); last = now;
  if (t >= TMAX) pause();
  render();
  if (running) requestAnimationFrame(loop);
}

// --- Çizim ---
const { ctx, size } = FR.canvas(document.getElementById("cv"));
function niceStep(range, n = 4) {
  const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
function axes(box, lo, hi, color, label, unit, c) {
  const { x: gx, y: gy, w: gw, h: gh } = box;
  const X = (tt) => gx + tt / TMAX * gw, Y = (v) => gy + gh - (v - lo) / (hi - lo) * gh;
  const step = niceStep(hi - lo);
  ctx.font = "12px 'JetBrains Mono', monospace"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    const zero = Math.abs(v) < 1e-9;
    ctx.strokeStyle = zero ? c.muted : c.line; ctx.lineWidth = zero ? 1.3 : 1;
    ctx.beginPath(); ctx.moveTo(gx, Y(v)); ctx.lineTo(gx + gw, Y(v)); ctx.stroke();
    ctx.fillStyle = c.muted; ctx.fillText(+v.toFixed(2), gx - 6, Y(v));
  }
  ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.strokeRect(gx, gy, gw, gh);
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.font = "italic 600 15px 'Instrument Sans', sans-serif"; ctx.fillStyle = color;
  ctx.fillText(`${label} (${unit})`, gx + 8, gy + 6);
  return { X, Y };
}
function curve(f, X, Y, color, box, t0, t1, alpha, width) {
  ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
  for (let k = 0; k <= 200; k++) { const tt = t0 + (t1 - t0) * k / 200; ctx.lineTo(X(tt), Y(f(tt))); }
  ctx.stroke(); ctx.restore();
}
function arrow(x0, x1, y, color, width = 3) {
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  if (Math.abs(x1 - x0) < 2) return;
  const s = Math.sign(x1 - x0);
  ctx.beginPath(); ctx.moveTo(x1 + s * 2, y); ctx.lineTo(x1 - s * 9, y - 6); ctx.lineTo(x1 - s * 9, y + 6); ctx.closePath(); ctx.fill();
}

function draw() {
  const { w: W, h: H } = size(), c = FR.colors(), m = M();
  ctx.clearRect(0, 0, W, H);
  const L = 58, Rr = 18, gw = W - L - Rr;
  const [xlo, xhi] = [-12, 12], TX = (xx) => L + (xx - xlo) / (xhi - xlo) * gw;
  const x0 = m.x(0), xt = m.x(t);

  // Alınan yolun izi: her dönüşte bir alt şeride geçer (yol üst üste binmesin)
  const LANE = 12, ty = 128, top = ty - 34 - path(TMAX).turns * LANE;
  ctx.strokeStyle = c.accent2; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.beginPath();
  let lane = 0, prev = Math.sign(m.v(0));
  const n = Math.ceil(t / 0.02);
  for (let k = 0; k <= n; k++) {
    const tt = Math.min(t, k * 0.02), sg = Math.sign(m.v(tt));
    if (sg && prev && sg !== prev) { lane++; ctx.lineTo(TX(m.x(tt)), top + lane * LANE); }
    if (sg) prev = sg;
    ctx.lineTo(TX(m.x(tt)), top + lane * LANE);
  }
  if (t > 0) ctx.stroke();
  ctx.fillStyle = c.accent2; ctx.font = "italic 600 13px 'Instrument Sans', sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillText("alınan yol (iz)", L, top - 8);

  // Ray, başlangıç bayrağı, araba
  ctx.strokeStyle = c.muted; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L, ty); ctx.lineTo(W - Rr, ty); ctx.stroke();
  ctx.font = "11px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = c.muted;
  for (let xx = xlo; xx <= xhi; xx += 4) { ctx.beginPath(); ctx.moveTo(TX(xx), ty - 4); ctx.lineTo(TX(xx), ty + 4); ctx.stroke(); ctx.fillText(`${xx}`, TX(xx), ty + 7); }
  ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(TX(x0), ty); ctx.lineTo(TX(x0), ty - 24); ctx.stroke();
  ctx.fillStyle = c.ink; ctx.beginPath(); ctx.moveTo(TX(x0), ty - 24); ctx.lineTo(TX(x0) + 11, ty - 20); ctx.lineTo(TX(x0), ty - 16); ctx.fill();
  const cx = TX(xt);
  ctx.fillStyle = c.accent; ctx.beginPath(); ctx.roundRect(cx - 14, ty - 20, 28, 14, 4); ctx.fill();
  ctx.fillStyle = c.ink; for (const dx of [-8, 8]) { ctx.beginPath(); ctx.arc(cx + dx, ty - 5, 3.5, 0, 7); ctx.fill(); }
  // Yer değiştirme oku (başlangıçtan şimdiki konuma)
  const ay = ty + 34;
  arrow(TX(x0), TX(xt), ay, c.accent);
  ctx.fillStyle = c.accent; ctx.font = "italic 600 13px 'Instrument Sans', sans-serif"; ctx.textBaseline = "top"; ctx.textAlign = "center";
  ctx.fillText("Δx", (TX(x0) + TX(xt)) / 2, ay + 7);

  // x–t ve v–t
  const gy = ay + 32, gap = 14, avail = H - gy - 34 - gap;
  const b1 = { x: L, y: gy, w: gw, h: avail * 0.45 }, b2 = { x: L, y: gy + avail * 0.45 + gap, w: gw, h: avail * 0.55 };
  const A = axes(b1, -12, 12, c.ink, "x", "m", c);
  curve(m.x, A.X, A.Y, c.ink, b1, 0, TMAX, 0.25, 2); if (t > 0) curve(m.x, A.X, A.Y, c.ink, b1, 0, t, 1, 2.5);
  // Δx: x₀ seviyesinden şimdiki x'e dikey ok
  ctx.strokeStyle = c.muted; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(A.X(0), A.Y(x0)); ctx.lineTo(A.X(t), A.Y(x0)); ctx.stroke(); ctx.setLineDash([]);
  if (Math.abs(A.Y(xt) - A.Y(x0)) > 4) {
    ctx.strokeStyle = ctx.fillStyle = c.accent; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(A.X(t), A.Y(x0)); ctx.lineTo(A.X(t), A.Y(xt)); ctx.stroke();
    const s = Math.sign(A.Y(xt) - A.Y(x0));
    ctx.beginPath(); ctx.moveTo(A.X(t), A.Y(xt) + s * 2); ctx.lineTo(A.X(t) - 5, A.Y(xt) - s * 8); ctx.lineTo(A.X(t) + 5, A.Y(xt) - s * 8); ctx.fill();
  }
  ctx.fillStyle = c.ink; ctx.beginPath(); ctx.arc(A.X(t), A.Y(xt), 4.5, 0, 7); ctx.fill();

  let vmax = 0; for (let k = 0; k <= 100; k++) vmax = Math.max(vmax, Math.abs(m.v(k / 10)));
  vmax = vmax * 1.25 + 0.3;
  const B = axes(b2, -vmax, vmax, c.ink, "v", "m/s", c);
  // v–t alanı: eksen üstü (ileri) ve altı (geri) ayrı renk
  if (t > 0) for (const [sg, col] of [[1, c.accent], [-1, c.accent2]]) {
    ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(B.X(0), B.Y(0));
    for (let k = 0; k <= 200; k++) { const tt = t * k / 200, vv = m.v(tt); ctx.lineTo(B.X(tt), B.Y(sg > 0 ? Math.max(0, vv) : Math.min(0, vv))); }
    ctx.lineTo(B.X(t), B.Y(0)); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  curve(m.v, B.X, B.Y, c.ink, b2, 0, TMAX, 0.25, 2); if (t > 0) curve(m.v, B.X, B.Y, c.ink, b2, 0, t, 1, 2.5);
  ctx.fillStyle = c.ink; ctx.beginPath(); ctx.arc(B.X(t), B.Y(m.v(t)), 4.5, 0, 7); ctx.fill();
  ctx.font = "italic 600 13px 'Instrument Sans', sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "top";
  ctx.fillStyle = c.accent; ctx.fillText("ileri (+)", b2.x + b2.w - 8, b2.y + 6);
  ctx.textBaseline = "bottom"; ctx.fillStyle = c.accent2; ctx.fillText("geri (−)", b2.x + b2.w - 8, b2.y + b2.h - 6);

  ctx.fillStyle = c.muted; ctx.font = "12px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let s = 0; s <= TMAX; s += 2) ctx.fillText(s, b2.x + s / TMAX * b2.w, b2.y + b2.h + 5);
  ctx.textAlign = "right"; ctx.fillText("t (s)", b2.x + b2.w, b2.y + b2.h + 19);
}

// --- Metin ---
setEqs(document.getElementById("formula"), [R`$\Delta x = x - x_0 \qquad s = \int_0^t |v|\,dt$`]);
setEqs(document.getElementById("rules"), [
  R`**Yer değiştirme** $\Delta x$: *işaretli (yönlü); − geri demek*`,
  R`**Alınan yol** $s$: *hep pozitif, hiç azalmaz*`,
  R`$s \ge |\Delta x|$ *; eşitlik yalnızca hiç dönmeyen harekette*`,
  R`$v$–$t$ *:* $\Delta x = \cA{A_+} - \cB{A_-}$ *,* $s = \cA{A_+} + \cB{A_-}$`,
]);
function render() {
  const m = M(), f = (n) => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2), p = (n) => (n < 0 ? `(${f(n)})` : f(n));
  const x0 = m.x(0), xt = m.x(t), dx = xt - x0, { s, turns } = path(t);
  const ap = (s + dx) / 2, an = (s - dx) / 2;   // A₊ = ileri, A₋ = geri gidilen
  const tt = t > 0 ? t.toFixed(2) : null;
  setEqs(document.getElementById("calc"), [
    `$\\Delta x = x - x_0 = ${f(xt)} - ${p(x0)} = \\mathbf{${f(dx)}}\\ \\text{m}$`,
    `$s = \\cA{${f(ap)}} + \\cB{${f(an)}} = \\mathbf{${f(s)}}\\ \\text{m}$ *(${turns} dönüş)*`,
    tt ? `*Ortalama hız:* $\\bar v = \\dfrac{\\Delta x}{t} = \\dfrac{${f(dx)}}{${tt}} = \\mathbf{${f(dx / t)}}\\ \\text{m/s}$`
       : `*Ortalama hız:* $\\bar v = \\Delta x / t$ *(t > 0 için)*`,
    tt ? `*Ortalama sürat:* $\\dfrac{s}{t} = \\dfrac{${f(s)}}{${tt}} = \\mathbf{${f(s / t)}}\\ \\text{m/s}$`
       : `*Ortalama sürat:* $s / t$`,
  ]);
  draw();
}
new ResizeObserver(draw).observe(document.getElementById("cv"));
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.fonts?.addEventListener("loadingdone", draw);
setT(0);
render();
</script>
</body>
