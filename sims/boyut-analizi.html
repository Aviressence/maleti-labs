<script>
const R = String.raw;

// --- Büyüklükler ve boyutları (M, L, T üsleri) ---
const Q = {
  x:  { tex: "x",     d: { L: 1 },              ad: "konum" },
  v0: { tex: "v_0",   d: { L: 1, T: -1 },       ad: "ilk hız" },
  v:  { tex: "v",     d: { L: 1, T: -1 },       ad: "hız" },
  a:  { tex: "a",     d: { L: 1, T: -2 },       ad: "ivme" },
  t:  { tex: "t",     d: { T: 1 },              ad: "zaman" },
  m:  { tex: "m",     d: { M: 1 },              ad: "kütle" },
  F:  { tex: "F",     d: { M: 1, L: 1, T: -2 }, ad: "kuvvet" },
  K:  { tex: "K",     d: { M: 1, L: 2, T: -2 }, ad: "kinetik enerji" },
  U:  { tex: "U",     d: { M: 1, L: 2, T: -2 }, ad: "potansiyel enerji" },
  g:  { tex: "g",     d: { L: 1, T: -2 },       ad: "yerçekimi ivmesi" },
  h:  { tex: "h",     d: { L: 1 },              ad: "yükseklik" },
  L:  { tex: "L",     d: { L: 1 },              ad: "ip uzunluğu" },
  T:  { tex: "T",     d: { T: 1 },              ad: "periyot" },
  P:  { tex: "P",     d: { M: 1, L: 2, T: -3 }, ad: "güç" },
  k:  { tex: "k",     d: { M: 1, T: -2 },       ad: "yay sabiti" },
  A:  { tex: "A",     d: { L: 1 },              ad: "genlik" },
  mu: { tex: R`\mu`,  d: { M: 1, L: -1 },       ad: "birim uzunluk kütlesi" },
};

// --- Denetlenecek denklemler (bazıları bilerek yanlış) ---
// f: çarpanlar ve üsleri; k: boyutsuz katsayı (½, 2, 2π)
const EQS = [
  { lhs: { tex: "x", f: { x: 1 } },   rhs: [{ tex: "v_0 t", f: { v0: 1, t: 1 } }, { tex: R`\tfrac12 a t^2`, f: { a: 1, t: 2 }, k: R`\tfrac12` }] },
  { lhs: { tex: "x", f: { x: 1 } },   rhs: [{ tex: "v_0 t", f: { v0: 1, t: 1 } }, { tex: "a t", f: { a: 1, t: 1 } }] },
  { lhs: { tex: "v", f: { v: 1 } },   rhs: [{ tex: "v_0", f: { v0: 1 } }, { tex: "a t", f: { a: 1, t: 1 } }] },
  { lhs: { tex: "v^2", f: { v: 2 } }, rhs: [{ tex: "v_0^2", f: { v0: 2 } }, { tex: "2 a x", f: { a: 1, x: 1 }, k: "2" }] },
  { lhs: { tex: "v^2", f: { v: 2 } }, rhs: [{ tex: "v_0^2", f: { v0: 2 } }, { tex: "2 a t", f: { a: 1, t: 1 }, k: "2" }] },
  { lhs: { tex: "F", f: { F: 1 } },   rhs: [{ tex: "m a", f: { m: 1, a: 1 } }] },
  { lhs: { tex: "K", f: { K: 1 } },   rhs: [{ tex: R`\tfrac12 m v^2`, f: { m: 1, v: 2 }, k: R`\tfrac12` }] },
  { lhs: { tex: "K", f: { K: 1 } },   rhs: [{ tex: "m v", f: { m: 1, v: 1 } }] },
  { lhs: { tex: "U", f: { U: 1 } },   rhs: [{ tex: "m g h", f: { m: 1, g: 1, h: 1 } }] },
  { lhs: { tex: "T", f: { T: 1 } },   rhs: [{ tex: R`2\pi\sqrt{L/g}`, f: { L: 0.5, g: -0.5 }, k: R`2\pi` }] },
  { lhs: { tex: "T", f: { T: 1 } },   rhs: [{ tex: R`2\pi\sqrt{g/L}`, f: { g: 0.5, L: -0.5 }, k: R`2\pi` }] },
  { lhs: { tex: "P", f: { P: 1 } },   rhs: [{ tex: "F v", f: { F: 1, v: 1 } }] },
];
const eqTex = (e) => `${e.lhs.tex} = ${e.rhs.map((t) => t.tex).join(" + ")}`;

// --- Türetme soruları: hedef ∝ x^α y^β z^γ ---
const PROBS = [
  { ad: "Sarkacın periyodu", kisa: "Sarkaç periyodu", hedef: "T", vars: ["m", "L", "g"], sol: [0, 0.5, -0.5],
    sonuc: R`T = C\sqrt{L/g}`, not: "Kütlenin üssü 0: periyot kütleye bağlı değil. C = 2π; boyut analizi bunu bulamaz." },
  { ad: "Yay–kütle sisteminin periyodu", kisa: "Yay–kütle periyodu", hedef: "T", vars: ["m", "k", "A"], sol: [0.5, -0.5, 0],
    sonuc: R`T = C\sqrt{m/k}`, not: "Genliğin üssü 0: periyot genliğe bağlı değil. C = 2π." },
  { ad: "Serbest düşmede yere çarpma hızı", kisa: "Düşme hızı", hedef: "v", vars: ["m", "h", "g"], sol: [0, 0.5, 0.5],
    sonuc: R`v = C\sqrt{g h}`, not: "Kütlenin üssü 0: hafif ve ağır cisim aynı hızla çarpar. C = √2 (enerji korunumundan)." },
  { ad: "Gergin ipte dalga hızı", kisa: "İpte dalga hızı", hedef: "v", vars: ["F", "mu", "L"], sol: [0.5, -0.5, 0],
    sonuc: R`v = C\sqrt{F/\mu}`, not: "İp uzunluğunun üssü 0: hız ipin boyuna bağlı değil. C = 1." },
];
const GREEK = [R`\alpha`, R`\beta`, R`\gamma`], GREEK_TXT = ["α", "β", "γ"], VCLASS = ["c1", "c2", ""];

// --- Yardımcılar ---
const DIMS = ["M", "L", "T"];
const frac = (x) => (Number.isInteger(x) ? String(x) : `${x < 0 ? "-" : ""}\\tfrac{${Math.abs(x * 2)}}{2}`);
const fracTxt = (x) => (Number.isInteger(x) ? String(x).replace("-", "−") : `${x < 0 ? "−" : ""}${Math.abs(x * 2)}/2`);
// {M:1,L:-1} → \mathsf{M}\,\mathsf{L}^{-1};  hepsi 0 → 1
function dimTex(d) {
  const parts = DIMS.filter((k) => d[k]).map((k) => `\\mathsf{${k}}${d[k] === 1 ? "" : `^{${frac(d[k])}}`}`);
  return parts.length ? parts.join(R`\,`) : "1";
}
const dimOf = (f) => {
  const d = { M: 0, L: 0, T: 0 };
  for (const q in f) for (const k of DIMS) d[k] += (Q[q].d[k] || 0) * f[q];
  return d;
};
const same = (a, b) => DIMS.every((k) => Math.abs((a[k] || 0) - (b[k] || 0)) < 1e-9);
const single = (d) => DIMS.filter((k) => d[k]).length === 1 && DIMS.some((k) => d[k] === 1);
// [v_0][t] = (L T^-1)(T)
function substTex(f) {
  const brackets = Object.entries(f).map(([q, p]) => `[${Q[q].tex}]${p === 1 ? "" : `^{${frac(p)}}`}`).join("");
  const dims = Object.entries(f).map(([q, p]) => {
    const base = dimTex(Q[q].d);
    if (p === 1) return single(Q[q].d) ? base : `(${base})`;
    return single(Q[q].d) ? `${base}^{${frac(p)}}` : `(${base})^{${frac(p)}}`;
  }).join(R`\,`);
  return `${brackets} = ${dims}`;
}

// --- Durum ---
const S = urlState({ mod: "denet", denk: 0, soru: 0, u0: 0, u1: 0, u2: 0 });
S.denk = Math.min(Math.max(0, S.denk | 0), EQS.length - 1);
S.soru = Math.min(Math.max(0, S.soru | 0), PROBS.length - 1);
const main = document.getElementById("main"), formula = document.getElementById("formula"), rules = document.getElementById("rules");

setEqs(document.getElementById("derived"), [
  R`**Türetilmiş:** $\text{N} = \text{kg}\,\text{m}\,\text{s}^{-2}$ · $\text{J} = \text{N}\,\text{m}$ · $\text{W} = \text{J/s}$ · $\text{Pa} = \text{N/m}^2$`,
]);

// Denklem listesi
document.getElementById("eqlist").innerHTML = EQS.map((e, i) =>
  `<button data-i="${i}"><span class="num">${i + 1}</span>${tex(eqTex(e))}</button>`).join("");
document.getElementById("eqlist").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.denk = +b.dataset.i; S.save(); render();
};
// Soru listesi
document.getElementById("plist").innerHTML = PROBS.map((p, i) =>
  `<button data-i="${i}" title="${p.ad}"><span class="num">${i + 1}</span>${p.kisa}</button>`).join("");
document.getElementById("plist").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.soru = +b.dataset.i; S.u0 = S.u1 = S.u2 = 0; S.save(); buildSliders(); render();
};

segment("mode", () => S.mod, (v) => { S.mod = v; S.save(); render(); });
document.querySelectorAll("[data-fs]").forEach((b) => (b.onclick = () => FR.fullscreen(document.querySelector(".sim-layout"))));
document.getElementById("solve").onclick = () => { [S.u0, S.u1, S.u2] = PROBS[S.soru].sol; S.save(); buildSliders(); render(); };
document.getElementById("zero").onclick = () => { S.u0 = S.u1 = S.u2 = 0; S.save(); buildSliders(); render(); };

// Üs kaydırıcıları (−2 … 2, ½ adım)
function buildSliders() {
  const p = PROBS[S.soru], box = document.getElementById("sliders");
  box.innerHTML = p.vars.map((q, i) => `
    <div class="ctrl"><label><span>${rich(`$${Q[q].tex}$ *(${Q[q].ad})* üssü $${GREEK[i]}$`)}</span><output id="o${i}"></output></label>
    <input type="range" min="-2" max="2" step="0.5" value="${S["u" + i]}" data-i="${i}"></div>`).join("");
  box.querySelectorAll("input").forEach((inp) => {
    const i = +inp.dataset.i, out = document.getElementById("o" + i);
    const sync = () => (out.textContent = fracTxt(+inp.value));
    inp.oninput = () => { S["u" + i] = +inp.value; S.save(); sync(); render(); };
    sync();
  });
}

const RULES_DENET = [
  "**Toplanan terimler** *aynı boyutta olmalıdır.*",
  "**Eşitliğin iki yanı** *aynı boyutta olmalıdır.*",
  R`**Sayılar boyutsuzdur:** $\tfrac12,\ 2,\ 2\pi$`,
  R`$\sin,\ \cos,\ e^{x},\ \ln$ *içindeki ifade boyutsuz olmalıdır.*`,
  "**Dikkat:** *tutarlı olmak, doğru olmayı kanıtlamaz.*",
];
const RULES_TURET = [
  R`**Yöntem:** $Q \propto x^{\alpha}\,y^{\beta}\,z^{\gamma}$ *yaz, boyutları yerine koy.*`,
  R`*Üsleri* $\mathsf{M},\mathsf{L},\mathsf{T}$ *için ayrı ayrı eşitle.*`,
  "**Sınır:** *boyutsuz sabit C bulunamaz.*",
];

function renderDenet() {
  const e = EQS[S.denk], dl = dimOf(e.lhs.f);
  setEqs(formula, [`$${eqTex(e)}$`]);
  document.querySelectorAll("#eqlist button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.i === S.denk));
  const card = (t, cls) => {
    const d = dimOf(t.f);
    const lines = [`$${substTex(t.f)}$`];
    if (t.k) lines.push(`$${t.k}$ *boyutsuz*`);
    return `<div class="term ${cls}"><div class="tt">${tex(t.tex)}</div><div class="calc" data-lines='${encodeURIComponent(JSON.stringify(lines))}'></div>` +
      `<div class="res">${tex(`= ${cls === "lhs" ? "" : `\\htmlClass{${cls === "good" ? "dim-ok" : "dim-bad"}}{`}${dimTex(d)}${cls === "lhs" ? "" : "}"}`)}</div></div>`;
  };
  const bad = e.rhs.filter((t) => !same(dimOf(t.f), dl));
  main.innerHTML =
    `<div class="q">Her terimin boyutunu bul; eşitliğin iki yanı ve toplanan terimler aynı boyutta mı?</div>` +
    `<div class="terms">${card(e.lhs, "lhs")}<span class="op">=</span>` +
    e.rhs.map((t) => card(t, same(dimOf(t.f), dl) ? "good" : "bad")).join(`<span class="op">+</span>`) + `</div>` +
    (bad.length
      ? `<div class="verdict bad">${rich(`**✗ Boyutça tutarsız.** $${bad.map((t) => t.tex).join(",\\ ")}$ *teriminin boyutu* $${dimTex(dimOf(bad[0].f))}$*, olması gereken* $${dimTex(dl)}$*. Bu denklem kesinlikle yanlış.*`)}</div>`
      : `<div class="verdict good">${rich(`**✓ Boyutça tutarlı:** *her terim* $${dimTex(dl)}$*. (Yine de doğruluğu kanıtlamaz; sayı katsayıları kontrol edilemez.)*`)}</div>`);
  main.querySelectorAll(".term .calc").forEach((el) => setEqs(el, JSON.parse(decodeURIComponent(el.dataset.lines))));
  setEqs(rules, RULES_DENET);
}

function renderTuret() {
  const p = PROBS[S.soru], ex = [S.u0, S.u1, S.u2], target = Q[p.hedef].d;
  document.querySelectorAll("#plist button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.i === S.soru));
  const v = p.vars.map((q, i) => `\\htmlClass{${VCLASS[i] || "x"}}{${Q[q].tex}}`);
  setEqs(formula, [`$${Q[p.hedef].tex} \\propto ${v.map((s, i) => `${s}^{${GREEK[i]}}`).join(R`\,`)}$`]);
  // toplam boyut
  const f = {}; p.vars.forEach((q, i) => (f[q] = ex[i]));
  const got = dimOf(f), ok = same(got, target);
  const dimFactors = p.vars.map((q, i) => {
    const base = dimTex(Q[q].d);
    return `\\htmlClass{${VCLASS[i] || "x"}}{${single(Q[q].d) ? base : `(${base})`}^{${frac(ex[i])}}}`;
  }).join(R`\,`);
  // her temel boyut için denklem: Σ katsayı·üs = hedef
  const rows = DIMS.map((k) => {
    const terms = p.vars.map((q, i) => [Q[q].d[k] || 0, i]).filter(([c]) => c);
    const sym = terms.length ? terms.map(([c, i], j) => {
      const sgn = c < 0 ? "-" : j ? "+" : "";
      const mag = Math.abs(c) === 1 ? "" : Math.abs(c);
      return `${sgn}${mag}${GREEK[i]}`;
    }).join(" ") : "0";
    const val = terms.reduce((s, [c, i]) => s + c * ex[i], 0), want = target[k] || 0, good = Math.abs(val - want) < 1e-9;
    return `<span>${tex(`\\mathsf{${k}}:`)}</span><span>${tex(`${sym} = ${want}`)}</span>` +
      `<span class="${good ? "dim-ok" : "dim-bad"}">${tex(`${frac(val)} ${good ? "=" : R`\neq`} ${want}`)} <span class="mark">${good ? "✓" : "✗"}</span></span>`;
  }).join("");
  main.innerHTML =
    `<div class="q">${rich(`**${p.ad}** $${Q[p.hedef].tex}$ *nelere bağlıdır?* ` +
      p.vars.map((q, i) => `$${v[i]}$ *(${Q[q].ad})*`).join(", ") + `. *Üsleri kaydırıcılarla değiştir.*`)}</div>` +
    `<div class="calc big" id="dimline"></div>` +
    `<div class="rows">${rows}</div>` +
    (ok ? `<div class="verdict good">${rich(`**✓ Buldun:** $${p.sonuc}$ · *${p.not}*`)}</div>`
        : `<div class="verdict bad">${rich(`*Sonuç* $${dimTex(got)}$*, olması gereken* $${dimTex(target)}$ *(${Q[p.hedef].ad}). Üsleri değiştir.*`)}</div>`);
  setEqs(document.getElementById("dimline"), [
    `$[${v.map((s, i) => `${s}^{${frac(ex[i])}}`).join(R`\,`)}] = ${dimFactors} = \\mathbf{${dimTex(got)}}$`,
    `$[${Q[p.hedef].tex}] = ${dimTex(target)}$ *(hedef)*`,
  ]);
  setEqs(rules, RULES_TURET);
}

function render() {
  document.getElementById("pane-denet").hidden = S.mod !== "denet";
  document.getElementById("pane-turet").hidden = S.mod !== "turet";
  document.getElementById("fsrow").hidden = S.mod === "turet"; // türetmede Tam ekran, çözüm düğmelerinin yanında
  S.mod === "turet" ? renderTuret() : renderDenet();
}
buildSliders();
render();
</script>
</body>
</html>
