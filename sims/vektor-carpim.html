<body class="sim-page">

  <div class="wrap">
    <a class="logo" href="../index.html">
      <img class="mark light" src="../assets/marka/ikon-acik-tema.png" alt=""><img class="mark dark" src="../assets/marka/ikon-koyu-tema.png" alt="">

    <button class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Koyu tema"><span class="knob"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3z"/></svg></span></button>

<main class="wrap">
  <div class="sim-title">
    <div><span class="tag">Fizik 1 · Hafta 01</span><h1>Skaler ve Vektörel Çarpım</h1></div>
    <div class="sim-formula" id="formula"></div>
  </div>

  <div class="sim-layout">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <span class="stage-hint">Okların uçlarını sürükleyin</span>
    </div>

    <aside class="panel">
      <div class="seg" id="mode">
        <button data-v="dot" data-tex="Skaler $\vec A\cdot\vec B$"></button>
        <button data-v="cross" data-tex="Vektörel $\vec A\times\vec B$"></button>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="snap" checked> Izgaraya yapıştır</label>
      </div>
      <div class="calc" id="calc"></div>
      <div class="rules"><span class="tag">Kurallar</span><div class="calc rules-list" id="rules"></div></div>
      <div class="row">
        <button class="btn ghost" id="reset">Sıfırla</button>
        <button class="btn ghost" id="fs">Tam ekran</button>
      </div>
    </aside>
  </div>
</main>

<script>
document.querySelectorAll("[data-tex]").forEach((el) => (el.innerHTML = rich(el.dataset.tex)));

const S = urlState({ ax: 5, ay: 1, bx: 2, by: 4, islem: "dot" });
const snap = document.getElementById("snap");
segment("mode", () => S.islem, (v) => { S.islem = v; S.save(); });
document.getElementById("reset").onclick = () => { Object.assign(S, { ax: 5, ay: 1, bx: 2, by: 4 }); S.save(); };
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));

const P = Plane(document.getElementById("cv"));
P.snap = () => snap.checked;
P.draggable(
  () => [{ id: "B", p: { x: S.bx, y: S.by } }, { id: "A", p: { x: S.ax, y: S.ay } }],
  (id, p) => { if (id === "A") { S.ax = p.x; S.ay = p.y; } else { S.bx = p.x; S.by = p.y; } },
  S.save
);
const calc = document.getElementById("calc"), rules = document.getElementById("rules"), formula = document.getElementById("formula");
const zero = { x: 0, y: 0 };

const RULES_DOT = [
  "**Tanım:** $\\vA\\cdot\\vB = |\\vA||\\vB|\\cos\\varphi$",
  "**Değişme:** $\\vA\\cdot\\vB = \\vB\\cdot\\vA$",
  "**Diklik** $(\\vA,\\vB\\neq\\vec 0)$**:** $\\vA\\perp\\vB \\iff \\vA\\cdot\\vB = 0$",
  "**Birim:** $\\ii\\cdot\\ii = \\jj\\cdot\\jj = 1,\\; \\ii\\cdot\\jj = 0$",
  "**İşaret:** $\\varphi < 90^\\circ \\Rightarrow +,\\;\\; \\varphi > 90^\\circ \\Rightarrow -$",
  "*Sonuç bir sayıdır (skaler), yönü yoktur.*",
];
const RULES_CROSS = [
  "**Büyüklük:** $|\\vA\\times\\vB| = |\\vA||\\vB|\\sin\\varphi$",
  "*Büyüklük, paralelkenarın alanına eşittir.*",
  "**Ters değişme:** $\\vA\\times\\vB = -\\,\\vB\\times\\vA$",
  "**Paralellik** $(\\vA,\\vB\\neq\\vec 0)$**:** $\\vA\\parallel\\vB \\iff \\vA\\times\\vB = \\vec 0$",
  "**Birim:** $\\ii\\times\\jj = \\kk,\\; \\jj\\times\\kk = \\ii,\\; \\kk\\times\\ii = \\jj$",
  "**Yön:** *sağ el kuralı*; sonuç hem $\\vA$ hem $\\vB$'ye diktir",
  "*Çizim xy düzleminde;* $+\\kk$ *dışarı,* $-\\kk$ *içeri*",
];

// ⊙ sayfadan dışarı, ⊗ sayfanın içine
function zSymbol(p, out, color) {
  const s = P.toPx(p), r = 11, ctx = P.ctx;
  ctx.save(); ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.stroke();
  if (out) { ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 7); ctx.fill(); }
  else {
    const d = r * 0.62;
    ctx.beginPath(); ctx.moveTo(s.x - d, s.y - d); ctx.lineTo(s.x + d, s.y + d);
    ctx.moveTo(s.x + d, s.y - d); ctx.lineTo(s.x - d, s.y + d); ctx.stroke();
  }
  ctx.restore();
}

function frame() {
  P.layout(0.4, 0.65);
  const c = FR.colors(), ctx = P.ctx;
  P.grid(c);
  const A = { x: S.ax, y: S.ay }, B = { x: S.bx, y: S.by };
  const mA = V.mag(A), mB = V.mag(B), d = V.dot(A, B), x = V.cross(A, B);
  const ok = mA > 0.005 && mB > 0.005;
  const phi = ok ? Math.atan2(x, d) * 180 / Math.PI : 0;   // A'dan B'ye işaretli açı
  const dot = S.islem === "dot";

  if (dot && ok) {
    // B'nin A doğrultusu üzerine izdüşümü
    const k = d / (mA * mA), proj = { x: A.x * k, y: A.y * k }, far = 40 / mA;
    P.dashed({ x: -A.x * far, y: -A.y * far }, { x: A.x * far, y: A.y * far }, c.line, 0.9);
    P.dashed(B, proj, c.accent2);
    P.arrow(zero, proj, c.ink, { width: 5, alpha: 0.85, label: "|B| cos φ", side: -1, vec: false });
  }
  if (!dot) {
    const pts = [zero, A, V.add(A, B), B].map(P.toPx);
    ctx.save(); ctx.fillStyle = c.ink; ctx.globalAlpha = 0.09;
    ctx.beginPath(); pts.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.fill(); ctx.restore();
    P.dashed(A, V.add(A, B), c.accent2); P.dashed(B, V.add(A, B), c.accent);
    if (Math.abs(x) > 0.005) zSymbol({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }, x > 0, c.ink);
  }
  P.arrow(zero, A, c.accent, { width: 3, label: "A" });
  P.arrow(zero, B, c.accent2, { width: 3, label: "B" });
  if (ok && Math.abs(phi) > 1) P.arc(zero, 32, V.ang(A), V.ang(A) + phi, c.ink, "φ");
  P.handle(A, c.accent); P.handle(B, c.accent2);

  const f = V.fmt, p = V.par, ph = Math.abs(phi).toFixed(1);
  const fi = ok ? `$\\varphi = \\mathbf{${ph}^\\circ}$ *(iki vektör arasındaki açı)*` : "*Vektörlerden biri sıfır; açı tanımsız.*";
  if (dot) {
    setEqs(formula, ["$\\vA\\cdot\\vB = |\\vA||\\vB|\\cos\\varphi$"]);
    setEqs(calc, [
      fi,
      `$\\vA\\cdot\\vB = \\cA{A_x}\\cB{B_x} + \\cA{A_y}\\cB{B_y}$`,
      `$\\vA\\cdot\\vB = \\cA{${p(A.x)}}\\cdot\\cB{${p(B.x)}} + \\cA{${p(A.y)}}\\cdot\\cB{${p(B.y)}} = \\mathbf{${f(d)}}$`,
      `$\\vA\\cdot\\vB = ${f(mA)}\\cdot ${f(mB)}\\cdot\\cos ${ph}^\\circ = \\mathbf{${f(d)}}$`,
    ]);
    setEqs(rules, RULES_DOT);
  } else {
    const dir = Math.abs(x) < 0.005 ? "yok *(vektörler paralel)*"
      : x > 0 ? "$+z$, *sayfadan dışarı* $\\odot$" : "$-z$, *sayfanın içine* $\\otimes$";
    setEqs(formula, ["$|\\vA\\times\\vB| = |\\vA||\\vB|\\sin\\varphi$"]);
    setEqs(calc, [
      fi,
      `$\\vA\\times\\vB = (\\cA{A_x}\\cB{B_y} - \\cA{A_y}\\cB{B_x})\\,\\kk$`,
      `$\\vA\\times\\vB = \\big(\\cA{${p(A.x)}}\\cdot\\cB{${p(B.y)}} - \\cA{${p(A.y)}}\\cdot\\cB{${p(B.x)}}\\big)\\kk = \\mathbf{${f(x)}}\\,\\kk$`,
      `$|\\vA\\times\\vB| = ${f(mA)}\\cdot ${f(mB)}\\cdot\\sin ${ph}^\\circ = \\mathbf{${f(Math.abs(x))}}$`,
      `**Yön:** ${dir}`,
    ]);
    setEqs(rules, RULES_CROSS);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
