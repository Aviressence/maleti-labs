<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x–t, v–t, a–t Grafikleri · MaLeTiLabs</title>
<link rel="icon" href="../assets/marka/ikon-acik-tema.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="../assets/marka/ikon-koyu-tema.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/katex-0.18.9/katex.min.css">
<link rel="stylesheet" href="../assets/style.css?v=1df4f872">
<script src="../assets/katex-0.18.9/katex.min.js"></script>
<script src="../assets/core.js?v=b689f43c"></script>
<script src="../assets/vec.js?v=628245b8"></script>
</head>
<body class="sim-page">

<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">
      <img class="mark light" src="../assets/marka/ikon-acik-tema.png" alt=""><img class="mark dark" src="../assets/marka/ikon-koyu-tema.png" alt="">
      <span class="wm"><span class="l1">Ma</span><span class="l2">Le</span><span class="l3">Ti</span><em>Labs</em></span>
    </a>
    <nav><a href="../index.html#fizik1">← Fizik 1</a></nav>
    <button class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Koyu tema"><span class="knob"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3z"/></svg></span></button>
  </div>
</header>

<main class="wrap">
  <div class="sim-title">
    <div><span class="tag">Fizik 1 · Hafta 02</span><h1>x–t, v–t, a–t Grafikleri</h1></div>
    <div class="sim-formula" id="formula"></div>
  </div>

  <div class="sim-layout">
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>

    <aside class="panel">
      <div class="ctrl"><label><span>İlk konum <i>x</i>₀</span><output id="ox0"></output></label>
        <input type="range" id="x0" min="-8" max="8" step="0.5"></div>
      <div class="ctrl"><label><span>İlk hız <i>v</i>₀</span><output id="ov0"></output></label>
        <input type="range" id="v0" min="-4" max="4" step="0.5"></div>
      <div class="ctrl"><label><span>İvme <i>a</i></span><output id="oa"></output></label>
        <input type="range" id="a" min="-2" max="2" step="0.1"></div>
      <div class="ctrl"><label><span>Zaman <i>t</i></span><output id="ot"></output></label>
        <input type="range" id="t" min="0" max="10" step="0.05"></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="slope" checked> Eğim (teğet)</label>
        <label class="check"><input type="checkbox" id="area" checked> Alan</label>
      </div>
      <div class="calc" id="calc"></div>
      <div class="rules"><span class="tag">Kurallar</span><div class="calc rules-list" id="rules"></div></div>
      <div class="row">
        <button class="btn" id="play">Oynat</button>
        <button class="btn ghost" id="reset">Başa al</button>
        <button class="btn ghost" id="fs">Tam ekran</button>
      </div>
    </aside>
  </div>
</main>

<script>
const R = String.raw, TMAX = 10;
const S = urlState({ x0: -6, v0: 3, a: -0.6 });
let t = 0, running = false, last = 0;
const x = (t) => S.x0 + S.v0 * t + 0.5 * S.a * t * t;
const v = (t) => S.v0 + S.a * t;

// --- Kontroller ---
const FMT = { x0: (n) => `${n} m`, v0: (n) => `${n} m/s`, a: (n) => `${n} m/s²` };
for (const k of ["x0", "v0", "a"]) {
  const inp = document.getElementById(k), out = document.getElementById("o" + k);
  inp.value = S[k];
  const sync = () => (out.textContent = FMT[k]((+inp.value).toFixed(k === "a" ? 1 : 1)));
  inp.oninput = () => { S[k] = +inp.value; S.save(); sync(); render(); };
  sync();
}
const tIn = document.getElementById("t"), tOut = document.getElementById("ot"), playBtn = document.getElementById("play");
const setT = (v) => { t = Math.min(TMAX, Math.max(0, v)); tIn.value = t; tOut.textContent = `${t.toFixed(2)} s`; };
tIn.oninput = () => { running = false; playBtn.textContent = "Oynat"; setT(+tIn.value); render(); };
playBtn.onclick = () => {
  if (t >= TMAX) setT(0);
  running = !running; playBtn.textContent = running ? "Duraklat" : "Oynat";
  last = performance.now(); if (running) requestAnimationFrame(loop);
};
document.getElementById("reset").onclick = () => { running = false; playBtn.textContent = "Oynat"; setT(0); render(); };
document.getElementById("fs").onclick = () => FR.fullscreen(document.querySelector(".sim-layout"));
const slopeCb = document.getElementById("slope"), areaCb = document.getElementById("area");
slopeCb.onchange = areaCb.onchange = () => render();

function loop(now) {
  if (!running) return;
  setT(t + (now - last) / 1000); last = now;
  if (t >= TMAX) { running = false; playBtn.textContent = "Oynat"; }
  render();
  if (running) requestAnimationFrame(loop);
}

// --- Çizim ---
const { ctx, size } = FR.canvas(document.getElementById("cv"));
// 1-2-5 dizisinden düzgün eksen adımı
function niceStep(range, n = 4) {
  const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
function graph(box, f, lo, hi, color, label, unit, c, extra) {
  const { x: gx, y: gy, w: gw, h: gh } = box;
  const X = (tt) => gx + tt / TMAX * gw, Y = (v) => gy + gh - (v - lo) / (hi - lo) * gh;
  // ızgara ve eksenler
  const step = niceStep(hi - lo);
  ctx.font = "12px 'JetBrains Mono', monospace"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    ctx.strokeStyle = Math.abs(v) < 1e-9 ? c.muted : c.line; ctx.lineWidth = Math.abs(v) < 1e-9 ? 1.3 : 1;
    ctx.beginPath(); ctx.moveTo(gx, Y(v)); ctx.lineTo(gx + gw, Y(v)); ctx.stroke();
    ctx.fillStyle = c.muted; ctx.fillText(+v.toFixed(2), gx - 6, Y(v));
  }
  ctx.strokeStyle = c.line; ctx.strokeRect(gx, gy, gw, gh);
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.font = "italic 600 15px 'Instrument Sans', sans-serif"; ctx.fillStyle = color;
  ctx.fillText(`${label} (${unit})`, gx + 8, gy + 6);
  if (extra) extra(X, Y);
  // eğri (0 → t kalın, t → 10 silik)
  const curve = (t0, t1, alpha, width) => {
    ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    for (let k = 0; k <= 120; k++) { const tt = t0 + (t1 - t0) * k / 120; ctx.lineTo(X(tt), Y(f(tt))); }
    ctx.stroke(); ctx.restore();
  };
  curve(0, TMAX, 0.25, 2); if (t > 0) curve(0, t, 1, 3);
  // şimdiki an
  ctx.strokeStyle = c.muted; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(t), gy); ctx.lineTo(X(t), gy + gh); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(t), Y(f(t)), 5, 0, 7); ctx.fill();
  return { X, Y };
}
const range = (f, pad) => {
  let lo = Infinity, hi = -Infinity;
  for (let k = 0; k <= 100; k++) { const y = f(k / 10); lo = Math.min(lo, y); hi = Math.max(hi, y); }
  lo = Math.min(lo, 0); hi = Math.max(hi, 0);
  const m = Math.max(pad, (hi - lo) * 0.12); return [lo - m, hi + m];
};

function draw() {
  const { w: W, h: H } = size(), c = FR.colors();
  ctx.clearRect(0, 0, W, H);
  const L = 58, Rr = 18, trackH = 64, gap = 12;
  // Ray ve araba
  const [xlo, xhi] = [-12, 12], TX = (xx) => L + (xx - xlo) / (xhi - xlo) * (W - L - Rr), ty = 40;
  ctx.strokeStyle = c.muted; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L, ty); ctx.lineTo(W - Rr, ty); ctx.stroke();
  ctx.font = "11px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = c.muted;
  for (let xx = xlo; xx <= xhi; xx += 4) { ctx.beginPath(); ctx.moveTo(TX(xx), ty - 4); ctx.lineTo(TX(xx), ty + 4); ctx.stroke(); ctx.fillText(`${xx}`, TX(xx), ty + 7); }
  const cx = TX(Math.min(xhi, Math.max(xlo, x(t))));
  ctx.fillStyle = c.accent; ctx.beginPath(); ctx.roundRect(cx - 16, ty - 22, 32, 16, 4); ctx.fill();
  ctx.fillStyle = c.ink; for (const dx of [-9, 9]) { ctx.beginPath(); ctx.arc(cx + dx, ty - 5, 4, 0, 7); ctx.fill(); }
  // hız oku
  const vv = v(t);
  if (Math.abs(vv) > 0.05) {
    const len = vv * 10, y0 = ty - 30;
    ctx.strokeStyle = ctx.fillStyle = c.accent2; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, y0); ctx.lineTo(cx + len, y0); ctx.stroke();
    const s = Math.sign(len); ctx.beginPath(); ctx.moveTo(cx + len + s * 6, y0); ctx.lineTo(cx + len - s * 3, y0 - 5); ctx.lineTo(cx + len - s * 3, y0 + 5); ctx.fill();
  }
  // Üç grafik
  const gh = (H - trackH - 30 - 2 * gap) / 3, box = (i) => ({ x: L, y: trackH + i * (gh + gap), w: W - L - Rr, h: gh });
  const [xl, xh] = range(x, 1), [vl, vh] = range(v, 0.5), aa = Math.max(Math.abs(S.a) * 1.4, 0.5);
  graph(box(0), x, xl, xh, c.accent, "x", "m", c, (X, Y) => {
    if (!slopeCb.checked) return;                    // teğet: eğimi o anki hız
    const t0 = Math.max(0, t - 1.6), t1 = Math.min(TMAX, t + 1.6);
    ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(X(t0), Y(x(t) + vv * (t0 - t))); ctx.lineTo(X(t1), Y(x(t) + vv * (t1 - t))); ctx.stroke(); ctx.setLineDash([]);
  });
  graph(box(1), v, vl, vh, c.accent2, "v", "m/s", c, (X, Y) => {
    if (!areaCb.checked || t <= 0) return;           // v–t altındaki alan = Δx (eksenin altı negatif)
    ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.moveTo(X(0), Y(0));
    for (let k = 0; k <= 80; k++) { const tt = t * k / 80; ctx.lineTo(X(tt), Y(v(tt))); }
    ctx.lineTo(X(t), Y(0)); ctx.closePath(); ctx.fill(); ctx.restore();
  });
  graph(box(2), () => S.a, -aa, aa, c.ink, "a", "m/s²", c, (X, Y) => {
    if (!areaCb.checked || t <= 0) return;           // a–t altındaki alan = Δv
    ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = c.accent2;
    ctx.fillRect(X(0), Math.min(Y(0), Y(S.a)), X(t) - X(0), Math.abs(Y(S.a) - Y(0))); ctx.restore();
  });
  // zaman ekseni
  const b = box(2);
  ctx.fillStyle = c.muted; ctx.font = "12px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let s = 0; s <= TMAX; s += 2) ctx.fillText(s, b.x + s / TMAX * b.w, b.y + b.h + 5);
  ctx.textAlign = "right"; ctx.fillText("t (s)", b.x + b.w, b.y + b.h + 5 + 14);
}

// --- Metin ---
setEqs(document.getElementById("formula"), [R`$x = x_0 + v_0 t + \tfrac12 a t^2$`]);
setEqs(document.getElementById("rules"), [
  R`**Hız** $=$ *x–t grafiğinin eğimi:* $v = dx/dt$`,
  R`**İvme** $=$ *v–t grafiğinin eğimi:* $a = dv/dt$`,
  R`$\Delta x$ $=$ *v–t altındaki alan (eksen altı −)*`,
  R`$\Delta v$ $=$ *a–t altındaki alan*`,
]);
function render() {
  const f = (n) => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2), tt = t.toFixed(2);
  setEqs(document.getElementById("calc"), [
    `$\\cA{x} = ${S.x0} + (${S.v0})(${tt}) + \\tfrac12(${S.a})(${tt})^2 = \\cA{\\mathbf{${f(x(t))}}}\\ \\text{m}$`,
    `$\\cB{v} = ${S.v0} + (${S.a})(${tt}) = \\cB{\\mathbf{${f(v(t))}}}\\ \\text{m/s}$`,
    `$\\Delta x = x - x_0 = \\mathbf{${f(x(t) - S.x0)}}\\ \\text{m}$ *(taralı alan)*`,
  ]);
  draw();
}
new ResizeObserver(draw).observe(document.getElementById("cv"));
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.fonts?.addEventListener("loadingdone", draw);
setT(0);
render();
</script>
</body>
</html>
