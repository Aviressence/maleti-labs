<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaLeTiLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7e847c89">
<script src="assets/core.js?v=a0c8a4df"></script>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-4 5-2"/><circle cx="12" cy="12" r="10.5" stroke-opacity=".35"/></svg>
      <span>MaLeTi<em>Labs</em></span>
    </a>
    <button class="icon-btn" data-theme-toggle aria-label="Temayı değiştir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">

  <section class="course" id="fizik1">
    <div class="course-head">
      <div><span class="tag">Ders 01</span><h2>Fizik 1</h2></div>
    </div>
    <div class="weeks" data-course="fizik1"></div>
  </section>

  <section class="course" id="dalgalar">
    <div class="course-head">
      <div><span class="tag">Ders 02</span><h2>Dalgalar &amp; Optik</h2></div>
    </div>
    <div class="weeks" data-course="dalgalar"></div>
  </section>
</main>


<script>
// Müfredat (fizik1.txt, dalgaveoptik.txt) — şimdilik ilk 3 hafta.
// Yeni simülasyon eklemek için ilgili haftada adı { ad, url } ile değiştir.
const COURSES = {
  fizik1: [
    ["Fizik ve Ölçme, Vektörler", [{ ad: "Vektör toplama", url: "sims/vektor-toplama.html" }, { ad: "Bileşenler", url: "sims/vektor-bilesenleri.html" }, { ad: "Skaler & vektörel çarpım", url: "sims/vektor-carpim.html" }]],
    ["Hareket, Hız ve İvme", ["x–t / v–t / a–t grafikleri", "Ortalama ve anlık hız"]],
    ["Tek Boyutlu ve İki Boyutlu Hareket", ["Serbest düşme", "Eğik atış", "Bağıl hareket"]],
  ],
  dalgalar: [
    ["Titreşim Hareketinin Temel Kavramları", [{ ad: "Sarkaç", url: "sims/sarkac.html" }, "Yay–kütle", "BHH ↔ dairesel hareket"]],
    ["Dalga Tipleri, 1B İlerleyen Dalgalar, Üst Üste Binme ve Girişim", ["Enine / boyuna dalga", "Atma ilerlemesi", "Süperpozisyon", { ad: "Dalga simülatörü", url: "sims/dalga-simulatoru/index.html" }]],
    ["Yansıma ve Geçiş, Harmonik Dalgalar, Sicimde Dalgalar, Enerji, Dalga Denklemi", ["Sabit / serbest uçta yansıma", "Ortam değişiminde geçiş", "Harmonik dalga (λ, k, ω)"]],
  ],
};

document.querySelectorAll("[data-course]").forEach((box) => {
  const list = COURSES[box.dataset.course];
  box.innerHTML = list.map(([topic, sims], i) => {
    const chips = sims.map((s) => {
      if (typeof s === "object") return `<a class="chip" href="${s.url}">${s.ad}</a>`;
      return `<span class="chip" title="Yakında">${s}</span>`;
    }).join("");
    return `<div class="week" style="animation-delay:${i * 40}ms">
      <span class="no">H${String(i + 1).padStart(2, "0")}</span>
      <span class="topic">${topic}</span>
      <div class="sims">${chips}</div></div>`;
  }).join("");
});
</script>
</body>
</html>
