<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaLeTiLabs</title>
<link rel="icon" href="assets/marka/ikon-acik-tema.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/marka/ikon-koyu-tema.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=a3054e01">
<script src="assets/core.js?v=40d9d8dc"></script>
</head>
<body>

<!-- Giriş: tam logo belirip kaybolur. Oturum başına bir kez; tıklama/tuş ile geçilir. -->
<div class="intro" id="intro" hidden><img alt="MaLeTiLabs"></div>
<script>
(() => {
  const el = document.getElementById("intro"), img = el.querySelector("img");
  let seen = false;
  try { seen = sessionStorage.getItem("fr-intro") === "1"; sessionStorage.setItem("fr-intro", "1"); } catch {}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.remove(); return; }
  const dark = FR.isDark();
  el.classList.toggle("dark", dark);
  let finished = false;
  const done = () => {
    if (finished) return; finished = true;
    el.classList.add("out"); setTimeout(() => el.remove(), 650);
  };
  img.onerror = () => el.remove();
  img.onload = () => { el.classList.add("in"); setTimeout(done, 1700); };
  img.src = `assets/marka/intro-${dark ? "koyu" : "acik"}.jpg`;
  el.hidden = false;
  el.addEventListener("click", done);
  addEventListener("keydown", done, { once: true });
  setTimeout(() => { if (!img.complete) el.remove(); }, 2500); // yavaş bağlantıda bekletmez
})();
</script>

<header class="bar">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img class="mark light" src="assets/marka/ikon-acik-tema.png" alt=""><img class="mark dark" src="assets/marka/ikon-koyu-tema.png" alt="">
      <span class="wm"><span class="l1">Ma</span><span class="l2">Le</span><span class="l3">Ti</span><em>Labs</em></span>
    </a>
    <button class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Koyu tema"><span class="knob"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3z"/></svg></span></button>
  </div>
</header>

<main class="wrap">

  <section class="course" id="fizik1">
    <div class="course-head">
      <div><span class="tag">Ders 01</span><h2>Fizik 1</h2></div>
      <div class="devices" id="devices"></div>
    </div>
    <div class="weeks" data-course="fizik1"></div>
  </section>

  <section class="course" id="dalgalar">
    <div class="course-head">
      <div><span class="tag">Ders 02</span><h2>Dalgalar &amp; Optik</h2></div>
    </div>
    <a class="lab-card" href="sims/dalga-simulatoru/index.html">
      <canvas class="lab-bg" id="labBg" aria-hidden="true"></canvas>
      <div class="lab-text"><h3>Dalga Simülatörü</h3></div>
      <span class="lab-go">Aç <span aria-hidden="true">→</span></span>
    </a>
    <div class="weeks" data-course="dalgalar"></div>
  </section>
</main>


<script>
// Müfredat (fizik1.txt, dalgaveoptik.txt) — şimdilik ilk 3 hafta.
// Yeni simülasyon eklemek için ilgili haftada adı { ad, url } ile değiştir.
// Bir hafta birden çok konu içeriyorsa simülasyonlar { grup, sims } ile gruplanır;
// grup düğmesine tıklanınca o grubun simülasyonları haftanın altında açılır.
const COURSES = {
  fizik1: [
    ["Fizik ve Ölçme, Vektörler", [
      { grup: "Fizik ve Ölçme", sims: [{ ad: "Birimler ve ön ekler", url: "sims/birimler.html" }, { ad: "Boyut analizi", url: "sims/boyut-analizi.html" }, { ad: "Anlamlı basamak ve belirsizlik", url: "sims/anlamli-basamak.html" }] },
      { grup: "Vektörler", sims: [{ ad: "Vektör toplama", url: "sims/vektor-toplama.html" }, { ad: "Bileşenler", url: "sims/vektor-bilesenleri.html" }, { ad: "Skaler & vektörel çarpım", url: "sims/vektor-carpim.html" }] },
    ]],
    ["Hareket, Hız ve İvme", [
      { grup: "Hız", sims: [{ ad: "Yer değiştirme ve alınan yol", url: "sims/yer-degistirme.html" }, { ad: "Ortalama ve anlık hız", url: "sims/ortalama-anlik.html?mod=hiz" }] },
      { grup: "İvme", sims: [{ ad: "Ortalama ve anlık ivme", url: "sims/ortalama-anlik.html?mod=ivme" }, { ad: "x–t / v–t / a–t grafikleri", url: "sims/hareket-grafikleri.html" }] },
    ]],
    ["Tek Boyutlu ve İki Boyutlu Hareket", [
      { grup: "Tek Boyutlu Hareket", sims: [{ ad: "Sabit ivmeli hareket", url: "sims/sabit-ivme.html" }, { ad: "Serbest düşme", url: "sims/serbest-dusme.html" }] },
      { grup: "İki Boyutlu Hareket", sims: ["Eğik atış", "Bağıl hareket"] },
    ]],
  ],
  dalgalar: [
    ["Titreşim Hareketinin Temel Kavramları", [
      { grup: "Salınıcılar", sims: [{ ad: "Sarkaç", url: "sims/sarkac.html" }, { ad: "Yay–kütle", url: "sims/yay-kutle.html" }] },
      { grup: "Basit Harmonik Hareket", sims: [{ ad: "BHH ↔ dairesel hareket", url: "sims/bhh.html?mod=daire" }, { ad: "Konum, hız, ivme ve faz", url: "sims/bhh.html?mod=faz" }] },
    ]],
    ["Dalga Tipleri, 1B İlerleyen Dalgalar, Üst Üste Binme ve Girişim", [
      { grup: "Dalga Tipleri", sims: ["Enine / boyuna dalga"] },
      { grup: "İlerleyen Dalgalar", sims: ["Atma ilerlemesi"] },
      { grup: "Üst Üste Binme ve Girişim", sims: ["Süperpozisyon"] },
    ]],
    ["Yansıma ve Geçiş, Harmonik Dalgalar, Sicimde Dalgalar, Enerji, Dalga Denklemi", [
      { grup: "Yansıma ve Geçiş", sims: ["Sabit / serbest uçta yansıma", "Ortam değişiminde geçiş"] },
      { grup: "Harmonik Dalgalar", sims: ["Harmonik dalga (λ, k, ω)", "Sicimde dalga hızı"] },
      { grup: "Enerji ve Dalga Denklemi", sims: ["Dalganın taşıdığı enerji", "Lineer dalga denklemi"] },
    ]],
  ],
};

// Hazır simülasyonu olmayan kategori kapalı gösterilir ("yakında").
// Hazır simülasyon: kendi sayfası. Henüz yapılmamış olan (düz metin): iskelet sayfası + "(yakında)".
const chip = (s, ders, hafta) => (typeof s === "object"
  ? `<a class="chip" href="${s.url}">${s.ad}</a>`
  : `<a class="chip todo" href="sims/yakinda.html?${new URLSearchParams({ ad: s, ders, hafta })}">${s} <small>(yakında)</small></a>`);

document.querySelectorAll("[data-course]").forEach((box) => {
  const ders = box.dataset.course, list = COURSES[ders];
  box.innerHTML = list.map(([topic, sims], i) => {
    const c = (s) => chip(s, ders, i + 1);
    const groups = sims.filter((s) => s.grup);
    const top = groups.length
      ? groups.map((g, k) => (g.sims.some((x) => typeof x === "object")
        ? `<button class="cat" aria-expanded="false" data-g="${k}">${g.grup}</button>`
        : `<button class="cat" disabled>${g.grup} <small>(yakında)</small></button>`)).join("")
      : sims.map(c).join("");
    const subs = groups.map((g, k) => !g.sims.some((x) => typeof x === "object") ? "" : `<div class="week-sub" data-g="${k}" hidden><span class="sub-label">${g.grup}</span>${g.sims.map(c).join("")}</div>`).join("");
    return `<div class="week" style="animation-delay:${i * 40}ms">
      <span class="no">H${String(i + 1).padStart(2, "0")}</span>
      <span class="topic">${topic}</span>
      <div class="sims">${top}</div>${subs}</div>`;
  }).join("");
});

// Dalga Simülatörü kartı: arka planda iki kaynaktan girişim deseni (düşük çözünürlükte hesaplanıp büyütülür).
// Hareket azaltma tercihinde tek kare; kart görünmüyorken durur.
(() => {
  const cv = document.getElementById("labBg"); if (!cv) return;
  const ctx = cv.getContext("2d"), CELL = 5;
  let img = null, gw = 0, gh = 0, visible = true, raf = 0;
  const hex = (h) => { h = h.trim().replace("#", ""); if (h.length === 3) h = [...h].map((q) => q + q).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const fit = () => {
    const r = cv.getBoundingClientRect(); gw = Math.max(1, Math.ceil(r.width / CELL)); gh = Math.max(1, Math.ceil(r.height / CELL));
    cv.width = gw; cv.height = gh; img = ctx.createImageData(gw, gh);
  };
  const frame = (now) => {
    const col = hex(FR.colors().accent), d = img.data, tt = now / 1000;
    const s1 = [gw * 0.78, gh * 0.25], s2 = [gw * 0.78, gh * 0.75], k = 2 * Math.PI / 11, om = 2.2;
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      const r1 = Math.hypot(i - s1[0], j - s1[1]), r2 = Math.hypot(i - s2[0], j - s2[1]);
      const u = (Math.sin(k * r1 - om * tt) / Math.sqrt(1 + r1 * 0.05) + Math.sin(k * r2 - om * tt) / Math.sqrt(1 + r2 * 0.05)) / 2;
      const o = (j * gw + i) * 4, q = Math.max(0, u);
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = Math.min(255, q * q * 330);
    }
    ctx.putImageData(img, 0, 0);
  };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const loop = (now) => { frame(now); if (visible && !still) raf = requestAnimationFrame(loop); };
  new ResizeObserver(() => { fit(); frame(performance.now()); }).observe(cv);
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; cancelAnimationFrame(raf); if (visible && !still) raf = requestAnimationFrame(loop); }).observe(cv);
  new MutationObserver(() => frame(performance.now())).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();

// Desteklenen cihazlar. ok: true → test edildi (yeşil ✓); false → gerçek cihazda henüz test edilmedi (sarı ✓).
const DEVICES = [
  { ad: "PC / Laptop", alt: ["Windows", "macOS", "Linux"], ok: true,
    svg: '<rect x="4" y="4.5" width="16" height="10.5" rx="1.3"/><path d="M2 18.5h20l-1.5-3.5h-17z"/>' },
  { ad: "Android", alt: ["Telefon", "Tablet"], ok: false,
    svg: '<path d="M5.5 16V11a6.5 6.5 0 0 1 13 0v5z"/><path d="M8 6.5 6.3 4M16 6.5 17.7 4"/><circle cx="9.5" cy="11" r=".6" fill="currentColor"/><circle cx="14.5" cy="11" r=".6" fill="currentColor"/><path d="M8.5 16v3.5M15.5 16v3.5"/>' },
  { ad: "Apple", alt: ["iPhone", "iPad"], ok: false,
    svg: '<path d="M12 7.5c-1-1.3-2.6-1.8-4-1.3C5.6 7 4.6 9.8 5.3 13c.6 2.9 2.3 6 4.2 6 1 0 1.5-.6 2.5-.6s1.5.6 2.5.6c1.9 0 3.6-3.1 4.2-6 .7-3.2-.3-6-2.7-6.8-1.4-.5-3 0-4 1.3z"/><path d="M12 7.5c0-2 1-3.5 2.8-4"/>' },
];
document.getElementById("devices").innerHTML =
  `<span class="tag">Desteklenen cihazlar</span><ul>${DEVICES.map((d) => `
    <li${d.ok ? "" : ' class="untested"'} title="${d.ad}${d.ok ? "" : ": henüz gerçek cihazda test edilmedi"}">
      <span class="dev-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d.svg}</svg>
        <b class="dev-badge${d.ok ? " ok" : ""}" aria-hidden="true">✓</b></span>
      <span class="dev-name">${d.ad}</span>
      <span class="dev-sub">${d.alt.join("<br>")}</span>
      ${d.ok ? "" : '<span class="sr-only">henüz test edilmedi</span>'}
    </li>`).join("")}</ul>
  <span class="dev-legend"><b>✓</b> henüz test edilmedi</span>`;

// Kategori düğmesi: kendi listesini açar/kapatır, aynı haftadaki diğer kategoriyi kapatır
document.addEventListener("click", (e) => {
  const b = e.target.closest(".cat");
  if (!b) return;
  const week = b.closest(".week"), open = b.getAttribute("aria-expanded") !== "true";
  week.querySelectorAll(".cat").forEach((x) => x.setAttribute("aria-expanded", x === b && open));
  week.querySelectorAll(".week-sub").forEach((s) => (s.hidden = !(open && s.dataset.g === b.dataset.g)));
});
</script>
</body>
</html>
